name: "Deploy Convex"
description: "Deploy Convex backend functions and schema"

inputs:
  deploy-key:
    description: "Convex deploy key for the target environment"
    required: true
  environment:
    description: "Target environment name (for logging)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Deploy Convex functions
      shell: bash
      env:
        CONVEX_DEPLOY_KEY: ${{ inputs.deploy-key }}
      run: |
        echo "Deploying Convex backend to ${{ inputs.environment }}..."
        cd packages/backend
        bunx convex deploy --cmd 'echo "skip build"'
        echo "Convex deployment complete"

    - name: Verify deployment
      shell: bash
      env:
        CONVEX_DEPLOY_KEY: ${{ inputs.deploy-key }}
      run: |
        echo "### Convex Deployment (${{ inputs.environment }})" >> "$GITHUB_STEP_SUMMARY"
        echo "SHA: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
        echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_STEP_SUMMARY"
