name: "Setup Bun Environment"
description: "Install Node, Bun, cache dependencies, and run bun install. Requires actions/checkout first."

inputs:
  bun-version:
    description: "Bun version to install"
    default: "1.4.2"
  node-version:
    description: "Node.js version (project TypeScript scripts need 22.6+)"
    default: "24"

runs:
  using: "composite"
  steps:
    - name: Find cached Node (act)
      id: node-cache
      if: ${{ env.ACT }}
      shell: bash
      env:
        NODE_VERSION: ${{ inputs.node-version }}
      run: bash "${{ github.action_path }}/find-node.sh"

    - name: Setup Node
      if: ${{ steps.node-cache.outputs.found != 'true' }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    - name: Setup Bun
      if: ${{ !env.ACT }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Setup Bun (act)
      if: ${{ env.ACT }}
      shell: bash
      env:
        BUN_VERSION: ${{ inputs.bun-version }}
      run: bash "${{ github.action_path }}/setup-bun-act.sh"

    - name: Cache dependencies
      if: ${{ !env.ACT }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      shell: bash
      run: |
        # Retry logic: when multiple act containers share the same bun cache
        # volume, concurrent `bun install` can race on symlink creation (EEXIST).
        MAX_ATTEMPTS=5
        for attempt in $(seq 1 $MAX_ATTEMPTS); do
          if bun install --frozen-lockfile; then
            break
          fi
          if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
            delay=$((attempt * 2))
            echo "bun install failed (attempt $attempt/$MAX_ATTEMPTS), retrying in ${delay}s..."
            sleep "$delay"
          else
            echo "bun install failed after $MAX_ATTEMPTS attempts"
            exit 1
          fi
        done

    # Local ports and origins from app.config.ts, as APP_CONFIG_* variables for
    # later steps (e.g. `APP_ORIGIN: ${{ env.APP_CONFIG_ORIGIN_WEB }}`), so CI
    # follows the app's configuration. Skipped for refs that predate the file,
    # such as an old commit checked out by a rollback. Commits before v2 keep the
    # reader in scripts/ rather than platform/tooling/.
    - name: Export app configuration
      shell: bash
      run: |
        if [ -f platform/tooling/app-config.ts ]; then
          ./platform/tooling/node-ts.sh platform/tooling/app-config.ts github-env >> "$GITHUB_ENV"
        elif [ -f scripts/app-config.ts ]; then
          ./scripts/node-ts.sh scripts/app-config.ts github-env >> "$GITHUB_ENV"
        fi
