name: "Deploy to Vercel"
description: "Deploy a prebuilt app artifact to Vercel"

inputs:
  app:
    description: "App name (web, admin, or landing)"
    required: true
  environment:
    description: "Target environment (preview or production)"
    required: true
  artifact-name:
    description: "Name of the artifact to download"
    required: true
  tarball:
    description: "Filename of the tarball within the artifact"
    required: true
  checksum-file:
    description: "Filename of the checksum file within the artifact"
    required: true
  vercel-token:
    description: "Vercel API token"
    required: true
  vercel-org-id:
    description: "Vercel organization ID"
    required: true
  vercel-project-id:
    description: "Vercel project ID for this app"
    required: true
  run-id:
    description: >-
      Workflow run to download the artifact from. Omit to use the current run.
      Set this to promote an artifact built by an earlier workflow (the staging
      deploy) instead of rebuilding it.
    required: false
    default: ""
  github-token:
    description: "Token used to download an artifact from another workflow run. Required with run-id."
    required: false
    default: ""
  deployed-commit:
    description: >-
      Commit being deployed. Set as a run-time variable so the app can report it
      alongside the commit its artifact was built from — for a reused artifact
      those differ, which is the point of content-addressing.
    required: false
    default: ""
  expected-hash:
    description: >-
      Build-input hash the artifact must carry. When set, the build manifest is
      checked against it. Artifacts are content-addressed, so this — not the
      commit SHA — is what identifies the right bytes.
    required: false
    default: ""

outputs:
  deployment-url:
    description: "URL of the Vercel deployment"
    value: ${{ steps.deploy.outputs.url }}

runs:
  using: "composite"
  steps:
    - name: Download artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: ${{ inputs.artifact-name }}
        path: deploy-artifacts
        # Empty values fall back to the current run, so the same step serves both
        # the build-and-deploy and the promote paths.
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.github-token }}

    # A promoted artifact is deployed without being rebuilt, so the only evidence
    # of what it contains is its manifest. Verify it before it reaches the
    # environment rather than trusting the artifact name.
    - name: Verify artifact provenance
      if: inputs.expected-hash != ''
      shell: bash
      working-directory: deploy-artifacts
      run: |
        MANIFEST="${{ inputs.app }}-manifest.json"
        if [ ! -f "$MANIFEST" ]; then
          echo "::error::${MANIFEST} missing from artifact ${{ inputs.artifact-name }}"
          exit 1
        fi

        BUILT_HASH=$(jq -r '.input_hash' "$MANIFEST")
        if [ "$BUILT_HASH" != "${{ inputs.expected-hash }}" ]; then
          echo "::error::Artifact carries input hash ${BUILT_HASH}, expected ${{ inputs.expected-hash }}"
          exit 1
        fi

        # The commit recorded here is the one that BUILT these bytes, which is
        # deliberately not always the commit being deployed: if an app's inputs
        # did not change, its artifact is reused across commits.
        echo "Artifact verified: input hash ${BUILT_HASH}, built from commit $(jq -r '.git_sha' "$MANIFEST")"
        {
          echo "### Promoted artifact: ${{ inputs.app }}"
          echo '```'
          jq -r '"input hash: \(.input_hash)\nbuilt from: \(.git_sha)\nbuilt at:   \(.timestamp)\nbuild run:  \(.workflow_run)\nchecksum:   \(.artifact_checksum)"' "$MANIFEST"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Verify checksum
      shell: bash
      working-directory: deploy-artifacts
      run: |
        echo "Verifying checksum for ${{ inputs.tarball }}..."
        sha256sum -c "${{ inputs.checksum-file }}"
        echo "Checksum verified successfully"

    - name: Extract artifact into workspace root
      shell: bash
      run: |
        # Extract .vercel/output into the workspace root (same layout as the
        # build step). The prebuilt output contains .nft.json trace files with
        # paths relative to the monorepo root, so node_modules must be
        # reachable from the same relative location.
        tar -xzf "deploy-artifacts/${{ inputs.tarball }}"

    - name: Install Vercel CLI
      shell: bash
      run: bun add -g vercel@59.26.0

    - name: Create Vercel project link
      shell: bash
      run: |
        mkdir -p ".vercel"
        printf '{"orgId":"%s","projectId":"%s"}' \
          "${{ inputs.vercel-org-id }}" \
          "${{ inputs.vercel-project-id }}" \
          > ".vercel/project.json"

    - name: Deploy to Vercel
      id: deploy
      shell: bash
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
      run: |
        DEPLOY_FLAGS="--prebuilt --token=${VERCEL_TOKEN}"

        if [ "${{ inputs.environment }}" = "production" ]; then
          DEPLOY_FLAGS="${DEPLOY_FLAGS} --prod"
        fi

        # Run-time only: it must not reach the build, or it would be inlined and
        # make the artifact commit-specific again.
        if [ -n "${{ inputs.deployed-commit }}" ]; then
          DEPLOY_FLAGS="${DEPLOY_FLAGS} --env DEPLOYED_COMMIT=${{ inputs.deployed-commit }}"
        fi

        echo "::group::Debug: deploy directory contents"
        ls -la .vercel/
        cat .vercel/project.json
        echo ""
        if [ -d ".vercel/output" ]; then
          echo ".vercel/output exists:"
          ls -la .vercel/output/
        else
          echo "WARNING: .vercel/output does not exist"
        fi
        echo "::endgroup::"

        # Disable -e so we can capture the error output before exiting
        set +e
        DEPLOY_OUTPUT=$(vercel deploy ${DEPLOY_FLAGS} 2>&1)
        DEPLOY_EXIT=$?
        set -e

        if [ $DEPLOY_EXIT -ne 0 ]; then
          echo "::error::Vercel deploy failed with exit code ${DEPLOY_EXIT}"
          echo "${DEPLOY_OUTPUT}"
          exit $DEPLOY_EXIT
        fi

        # Vercel prints info messages after the URL, so tail -1 grabs the
        # wrong line. Extract the actual https:// deployment URL instead.
        DEPLOYMENT_URL=$(echo "${DEPLOY_OUTPUT}" | grep -oE 'https://[^ ]+\.vercel\.app[^ ]*' | head -1)
        if [ -z "${DEPLOYMENT_URL}" ]; then
          echo "::error::Could not extract deployment URL from Vercel output:"
          echo "${DEPLOY_OUTPUT}"
          exit 1
        fi
        echo "url=${DEPLOYMENT_URL}" >> "$GITHUB_OUTPUT"

        echo "### Deployed: ${{ inputs.app }} (${{ inputs.environment }})" >> "$GITHUB_STEP_SUMMARY"
        echo "URL: ${DEPLOYMENT_URL}" >> "$GITHUB_STEP_SUMMARY"
