name: CI Admin

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      require_e2e:
        description: Require every E2E job for release verification
        type: boolean
        default: false
      git_sha:
        description: Source commit to test
        type: string
        required: false
        default: ""

concurrency:
  group: ci-admin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  # ============================================================
  # CHANGE DETECTION
  # ============================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ inputs.git_sha != '' && 'true' || steps.act-all.outputs.should_run || steps.evaluate.outputs.should_run }}
    steps:
      - name: Run all jobs in act
        if: ${{ env.ACT }}
        id: act-all
        run: |
          echo "Running in act — skipping change detection"
          echo "should_run=true" >> $GITHUB_OUTPUT

      - name: Checkout
        if: ${{ !env.ACT }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}

      - name: Detect file changes
        if: ${{ !env.ACT }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            admin:
              - 'apps/admin/**'
            backend:
              - 'packages/backend/**'
            design-system:
              - 'packages/design-system/**'
            auth:
              - 'packages/auth/**'
            root:
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - 'app.config.ts'
              - 'packages/app-config/**'
              - 'tsconfig.base.json'
              - 'eslint.config.mjs'
              - 'scripts/**'

      - name: Evaluate changes
        if: ${{ !env.ACT }}
        id: evaluate
        run: |
          if [[ "${{ steps.filter.outputs.admin }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.backend }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.design-system }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.auth }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.root }}" == "true" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "Skipping admin — no relevant changes"
          fi

  # ============================================================
  # UNIT & COMPONENT TESTS
  # ============================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}
      - uses: ./.github/actions/setup-bun

      - name: Run Bun tests
        run: cd apps/admin && bun run test

      - name: Run Vitest with coverage
        run: cd apps/admin && bun run test:coverage

      - name: Display coverage summary
        if: always()
        run: |
          JOB_DIR="/act-artifacts/admin/test"
          if [ -n "$ACT" ]; then
            mkdir -p "$JOB_DIR"
            SUMMARY_FILE="$JOB_DIR/step-summary.md"
          else
            SUMMARY_FILE="$GITHUB_STEP_SUMMARY"
          fi
          COVERAGE_FILE="apps/admin/qa/coverage/coverage-summary.json"
          if [ -f "$COVERAGE_FILE" ]; then
            echo "## Coverage Summary (admin)" >> "$SUMMARY_FILE"
            echo "" >> "$SUMMARY_FILE"
            echo "| Metric | Coverage |" >> "$SUMMARY_FILE"
            echo "|--------|----------|" >> "$SUMMARY_FILE"
            echo "| Lines | $(jq -r '.total.lines.pct' "$COVERAGE_FILE")% |" >> "$SUMMARY_FILE"
            echo "| Branches | $(jq -r '.total.branches.pct' "$COVERAGE_FILE")% |" >> "$SUMMARY_FILE"
            echo "| Functions | $(jq -r '.total.functions.pct' "$COVERAGE_FILE")% |" >> "$SUMMARY_FILE"
            echo "| Statements | $(jq -r '.total.statements.pct' "$COVERAGE_FILE")% |" >> "$SUMMARY_FILE"
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && !env.ACT }}
        continue-on-error: true
        with:
          name: coverage-report-admin
          path: apps/admin/qa/coverage/
          retention-days: 7

      - name: Save job outputs (act)
        if: ${{ always() && env.ACT }}
        run: |
          JOB_DIR="/act-artifacts/admin/test"
          mkdir -p "$JOB_DIR/artifacts"
          [ -d "apps/admin/qa/coverage" ] && cp -r "apps/admin/qa/coverage" "$JOB_DIR/artifacts/coverage-admin" 2>/dev/null || true

  # ============================================================
  # BUILD & BUNDLE SIZE
  # ============================================================
  build:
    name: Build & Bundle Size
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}
      - uses: ./.github/actions/setup-bun

      - name: Build
        run: bunx turbo build --filter=@repo/admin...
        env:
          CONVEX_URL: "https://placeholder.convex.cloud"
          CONVEX_SITE_URL: "https://placeholder.convex.site"
          APP_ORIGIN: ${{ env.APP_CONFIG_ORIGIN_ADMIN }}

      - name: Check bundle size
        run: cd apps/admin && bun run size

  # ============================================================
  # E2E TESTS
  # ============================================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.should_run == 'true' && (inputs.require_e2e || (vars.SKIP_E2E != 'true' && github.event.pull_request.draft == false))
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-playwright
        with:
          working-directory: apps/admin

      - name: Run Playwright tests
        run: cd apps/admin && bunx playwright test --project=chromium
        env:
          CI: true

      - name: Show dev logs on failure
        if: failure()
        run: |
          echo "=== Convex Dev Log ==="
          cat .convex-dev.log 2>/dev/null || echo "No Convex log found"
          echo ""
          echo "=== Next.js Dev Log (admin) ==="
          cat .next-admin.log 2>/dev/null || echo "No Next.js log found"

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && !env.ACT }}
        continue-on-error: true
        with:
          name: playwright-report-admin
          path: apps/admin/qa/playwright-report/
          retention-days: 7

      - name: Upload visual snapshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && !env.ACT }}
        continue-on-error: true
        with:
          name: visual-snapshots-admin
          path: apps/admin/qa/e2e/__screenshots__/
          retention-days: 7
          if-no-files-found: ignore

      - name: Save job outputs (act)
        if: ${{ always() && env.ACT }}
        run: |
          JOB_DIR="/act-artifacts/admin/e2e"
          mkdir -p "$JOB_DIR/artifacts"
          [ -d "apps/admin/qa/playwright-report" ] && cp -r "apps/admin/qa/playwright-report" "$JOB_DIR/artifacts/playwright-report-admin" 2>/dev/null || true
          [ -d "apps/admin/qa/e2e/__screenshots__" ] && cp -r "apps/admin/qa/e2e/__screenshots__" "$JOB_DIR/artifacts/visual-snapshots-admin" 2>/dev/null || true

  # ============================================================
  # SUMMARY
  # ============================================================
  ci-admin-complete:
    name: CI Admin Complete
    runs-on: ubuntu-latest
    needs: [changes, test, build, e2e]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "Changes should_run: ${{ needs.changes.outputs.should_run }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "E2E: ${{ needs.e2e.result }}"

          if [[ "${{ needs.changes.outputs.should_run }}" != "true" ]]; then
            echo "No relevant changes — skipping admin CI"
            exit 0
          fi

          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test failed: ${{ needs.test.result }}"
            exit 1
          fi

          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "Build failed: ${{ needs.build.result }}"
            exit 1
          fi

          E2E="${{ needs.e2e.result }}"
          if [[ "${{ inputs.require_e2e }}" == "true" && "$E2E" != "success" ]]; then
            echo "Release verification requires successful E2E tests"
            exit 1
          fi
          if [[ "$E2E" != "success" && "$E2E" != "skipped" ]]; then
            echo "E2E failed: $E2E"
            exit 1
          fi

          echo "All admin CI jobs passed"
