name: Platform Update

on:
  workflow_call:
    inputs:
      policy:
        type: string
        default: minor
      version:
        type: string
        default: ""
      auto-merge:
        type: boolean
        default: false
      source:
        description: Public platform release repository
        type: string
        default: tkarakai/web-app-starter
    secrets:
      PLATFORM_UPDATER_PRIVATE_KEY:
        required: false

concurrency:
  group: platform-update-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head: ${{ steps.release.outputs.head }}
      target: ${{ steps.release.outputs.target }}
      major: ${{ steps.release.outputs.major }}
      advisory: ${{ steps.release.outputs.advisory }}
      base: ${{ steps.release.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Discover releases and advisories
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
          POLICY: ${{ inputs.policy }}
          VERSION: ${{ inputs.version }}
        run: |
          args=(--repo "$SOURCE" --policy "$POLICY" --report "$RUNNER_TEMP/discovery.json")
          if [ -n "$VERSION" ]; then args+=(--to "$VERSION"); fi
          node platform/tooling/update-check.ts "${args[@]}"
      - name: Pin app identity and skip an existing update PR
        id: release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs'), cp = require('node:child_process');
            const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/discovery.json', 'utf8'));
            core.setOutput('head', cp.execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim());
            core.setOutput('base', context.payload.repository.default_branch);
            if (result.advisoryRelease) core.setOutput('advisory', result.advisoryRelease.version);
            if (result.major) core.setOutput('major', result.major.version);
            if (result.target) {
              const existing = await github.rest.pulls.list({...context.repo, state:'open', head:context.repo.owner + ':platform-update/v' + result.target.version});
              if (existing.data.length) core.notice('Existing update PR: ' + existing.data[0].html_url);
              else core.setOutput('target', result.target.version);
            }
            if (result.outcome === 'no-releases') throw Error('No published advisory source is available yet.');
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-discovery
          path: ${{ runner.temp }}/discovery.json
          retention-days: 14

  verify:
    needs: check
    if: needs.check.outputs.target != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CI: true
      CONVEX_AGENT_MODE: anonymous
      CONVEX_URL: http://127.0.0.1:3210
      CONVEX_SITE_URL: http://127.0.0.1:3211
      NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
      NEXT_PUBLIC_CONVEX_SITE_URL: http://127.0.0.1:3211
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Seed local origins for optional app builds
        run: |
          ./platform/tooling/ensure-app-env.sh --quiet
          echo "LANDING_URL=$APP_CONFIG_ORIGIN_LANDING" >> "$GITHUB_ENV"
      # This entire job has only a read token. No App key or write token is in its env.
      - name: Plan, apply and verify without E2E
        id: upgrade
        env:
          SOURCE: ${{ inputs.source }}
          TARGET: ${{ needs.check.outputs.target }}
          ADVISORY: ${{ needs.check.outputs.advisory }}
        run: |
          test ! -e upgrade-report.json && test ! -e upgrade-report.md
          mkdir -p "$RUNNER_TEMP/platform-delivery"
          set +e
          bun run platform:upgrade --to "v$TARGET" --source "$SOURCE" --advisory-release "$ADVISORY" --non-interactive --defer-e2e --report upgrade-report.json > "$RUNNER_TEMP/platform-delivery/upgrade.log" 2>&1
          status=$?
          set -e
          tail -c 12000 "$RUNNER_TEMP/platform-delivery/upgrade.log"
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then exit "$status"; fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('upgrade-report.json','utf8'));
          const ready=r.state.stage==='installed' && !r.plan.gates.some(g=>!r.state.decisions.some(d=>d.gateId===g.id));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'e2e='+ready+'\n');
          NODE
      - name: Install the target's browser builds
        if: steps.upgrade.outputs.e2e == 'true'
        run: |
          for app in apps/* platform/apps/*; do
            if [ -x "$app/node_modules/.bin/playwright" ]; then
              (cd "$app" && ./node_modules/.bin/playwright install --with-deps chromium)
            fi
          done
      - name: Finish E2E verification and record the baseline
        if: steps.upgrade.outputs.e2e == 'true'
        run: bun run platform:upgrade --resume upgrade-report.json >> "$RUNNER_TEMP/platform-delivery/upgrade.log" 2>&1
      - name: Package exact staged changes for delivery
        run: node platform/tooling/platform-update-artifact.ts "$RUNNER_TEMP/platform-delivery"
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-delivery
          path: ${{ runner.temp }}/platform-delivery/
          retention-days: 14
          if-no-files-found: warn

  deliver:
    needs: [check, verify]
    if: >-
      always() && !cancelled() && needs.check.result != 'skipped' &&
      (needs.check.result == 'failure' || needs.check.outputs.target != '' || needs.check.outputs.major != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Mint an App token only after verification has finished
        id: app-token
        if: vars.PLATFORM_UPDATER_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PLATFORM_UPDATER_APP_ID }}
          private-key: ${{ secrets.PLATFORM_UPDATER_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.head || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.check.result == 'success'
        with:
          name: platform-discovery
          path: ${{ runner.temp }}/discovery
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.verify.result == 'success'
        with:
          name: platform-delivery
          path: ${{ runner.temp }}/delivery
      # Only this inline workflow code, pinned actions and Git run with write credentials.
      # Do not replace this with a script, action, hook or package from the app/artifact.
      - name: Validate artifact and publish a PR or issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          BASE_HEAD: ${{ needs.check.outputs.head }}
          BASE_BRANCH: ${{ needs.check.outputs.base }}
          TARGET: ${{ needs.check.outputs.target }}
          MAJOR: ${{ needs.check.outputs.major }}
          SOURCE: ${{ inputs.source }}
          AUTO_MERGE: ${{ inputs.auto-merge }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const fs=require('node:fs'), cp=require('node:child_process'), crypto=require('node:crypto');
            const e=process.env, runURL=`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const requireThat=(ok,message)=>{if(!ok)throw Error(message);};
            const semver=/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
            requireThat(/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(e.SOURCE),'Invalid platform source');
            const read=(file,max)=>{const s=fs.lstatSync(file);requireThat(s.isFile()&&!s.isSymbolicLink()&&s.size<=max,'Invalid artifact file');return fs.readFileSync(file);};
            const sha=bytes=>crypto.createHash('sha256').update(bytes).digest('hex');
            const git=(args,options={})=>cp.execFileSync('git',['-c','core.hooksPath=/dev/null','-c','commit.gpgsign=false',...args],{encoding:'utf8',maxBuffer:40*1024*1024,...options}).trim();
            const ensureLabels=async names=>{for(const name of names){try{await github.rest.issues.getLabel({...context.repo,name});}catch(error){if(error.status!==404)throw error;await github.rest.issues.createLabel({...context.repo,name,color:name.startsWith('severity:')?'b60205':'0e8a16'});}}};
            const issue=async(title,body,labels)=>{
              const existing=await github.paginate(github.rest.issues.listForRepo,{...context.repo,state:'open',labels:'platform-update',per_page:100});
              if(existing.some(row=>!row.pull_request&&row.title===title)){core.notice('Existing issue: '+title);return;}
              await ensureLabels(labels);await github.rest.issues.create({...context.repo,title,body:body+'\n\n[Workflow evidence]('+runURL+')',labels});
            };
            const manual=version=>'`bun run platform:upgrade --to v'+version+' --source '+e.SOURCE+' --non-interactive --report upgrade-report.json`';
            if(e.CHECK_RESULT!=='success'){
              await issue('Platform update discovery failed','Release discovery failed. Inspect the workflow evidence and rerun after correcting the source or access.',['platform-update']);return;
            }
            const discovery=JSON.parse(read(e.RUNNER_TEMP+'/discovery/discovery.json',5*1024*1024));
            requireThat(discovery.schemaVersion===1&&discovery.source===e.SOURCE,'Discovery source mismatch');
            const severity=['low','medium','high','critical'].includes(discovery.severity)?['severity:'+discovery.severity]:[];
            if(e.MAJOR){
              requireThat(semver.test(e.MAJOR)&&discovery.major?.version===e.MAJOR,'Invalid major identity');
              await issue('Platform v'+e.MAJOR+' needs a major-upgrade review',`Review [release notes](https://github.com/${e.SOURCE}/releases/tag/v${e.MAJOR}) and [breaking changes](https://github.com/${e.SOURCE}/releases/download/v${e.MAJOR}/breaking-changes.json).\n\n${manual(e.MAJOR)}`,['platform-update','breaking',...severity]);
            }
            if(!e.TARGET)return;
            requireThat(semver.test(e.TARGET)&&discovery.target?.version===e.TARGET,'Invalid target identity');
            if(e.VERIFY_RESULT!=='success'){
              await issue('Platform v'+e.TARGET+' upgrade failed','The verifier could not certify this update. Inspect its retained report/log before retrying.\n\n'+manual(e.TARGET),['platform-update',...severity]);return;
            }
            try {
              const directory=e.RUNNER_TEMP+'/delivery/', data=JSON.parse(read(directory+'delivery.json',1024*1024));
              const patch=read(directory+'update.patch',32*1024*1024), markdown=read(directory+'report.md',8*1024*1024);
              requireThat(data.schemaVersion===1&&data.baseHead===e.BASE_HEAD&&data.target===e.TARGET&&data.installed===discovery.installed,'Delivery identity mismatch');
              requireThat(['verified','needs-review'].includes(data.outcome)&&/^[a-f0-9]{40}$/.test(data.tree)&&/^[a-f0-9]{40}$/.test(data.targetCommit)&&/^[a-f0-9]{64}$/.test(data.planDigest),'Invalid verification result');
              requireThat(sha(patch)===data.patchDigest&&sha(markdown)===data.markdownDigest,'Artifact digest mismatch');
              const permitted=['platform-update','breaking','migration','new-env','severity:low','severity:medium','severity:high','severity:critical'];
              requireThat(Array.isArray(data.labels)&&data.labels.every(name=>permitted.includes(name)),'Unexpected update labels');
              const branch='platform-update/v'+e.TARGET;
              const existing=await github.rest.pulls.list({...context.repo,state:'open',head:context.repo.owner+':'+branch});
              if(existing.data.length){core.notice('Existing PR: '+existing.data[0].html_url);return;}
              const current=await github.rest.repos.getBranch({...context.repo,branch:e.BASE_BRANCH});
              requireThat(current.data.commit.sha===e.BASE_HEAD,'App base advanced during verification; rerun to make a fresh plan');
              requireThat(git(['rev-parse','HEAD'])===e.BASE_HEAD,'Delivery checkout identity mismatch');
              git(['apply','--index','--binary','--whitespace=nowarn',directory+'update.patch']);
              requireThat(git(['write-tree'])===data.tree,'Applied tree differs from verified artifact');
              const changed=git(['diff','--cached','--name-only','-z']).split('\0').filter(Boolean);
              const report=JSON.parse(git(['show',':upgrade-report.json']));
              requireThat(report.plan.digest===data.planDigest&&report.plan.target.commit===data.targetCommit&&report.outcome===data.outcome,'Report does not match delivery metadata');
              if(!e.APP_TOKEN&&changed.some(file=>file.startsWith('.github/workflows/'))){
                await issue('Platform v'+e.TARGET+' needs a workflow-capable token','This release changes workflow files. Configure the updater GitHub App or run locally:\n\n'+manual(e.TARGET),['platform-update',...severity]);return;
              }
              git(['switch','-c',branch]);
              git(['-c','user.name=platform-updater[bot]','-c','user.email=platform-updater[bot]@users.noreply.github.com','commit','-m','Update platform to v'+e.TARGET]);
              // The credential is transient; never persist it or include it in process arguments.
              const token=e.APP_TOKEN||core.getInput('github-token',{required:true});
              const pushEnv={...e,GIT_CONFIG_COUNT:'1',GIT_CONFIG_KEY_0:'http.https://github.com/.extraheader',GIT_CONFIG_VALUE_0:'AUTHORIZATION: basic '+Buffer.from('x-access-token:'+token).toString('base64')};
              git(['push','origin','HEAD:refs/heads/'+branch],{env:pushEnv});
              const labels=[...new Set([...data.labels,...severity])];await ensureLabels(labels);
              const draft=data.outcome!=='verified';
              const recovery=draft?'\n\nCheck out this branch, then run `bun run platform:upgrade --resume upgrade-report.json --relocate` before making review edits. Resolve each reported item and resume; keep the PR draft until verification succeeds.':'';
              const fallback=e.APP_TOKEN?'':'\n\nGitHub token fallback: CI may require **Approve and run**. Confirm every required check before merging.';
              const body=markdown.toString('utf8').slice(0,45000)+recovery+fallback+'\n\n[Verification evidence]('+runURL+')';
              const pr=await github.rest.pulls.create({...context.repo,head:branch,base:e.BASE_BRANCH,draft,title:`Platform v${data.installed} → v${e.TARGET}${severity.length?' (security: '+discovery.severity+')':''}`,body});
              await github.rest.issues.addLabels({...context.repo,issue_number:pr.data.number,labels});core.notice(pr.data.html_url);
              if(e.AUTO_MERGE==='true'&&e.APP_TOKEN&&!draft&&data.autoMergeEligible===true&&severity.length===0){
                // Private GitHub Free repositories may have no enforceable branch protection.
                const protection=await github.rest.repos.getBranch({...context.repo,branch:e.BASE_BRANCH});
                const checks=protection.data.protection?.required_status_checks?.contexts;
                if(!protection.data.protected||!checks?.length)core.notice('Auto-merge skipped: required branch checks are not configured/available.');
                else try{await github.graphql('mutation($id:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:SQUASH}){pullRequest{id}}}',{id:pr.data.node_id});}catch(error){core.notice('Auto-merge unavailable; merge manually after CI: '+error.message);}
              }
            } catch(error) {
              await issue('Platform v'+e.TARGET+' delivery needs attention',String(error.message).slice(0,2000)+'\n\nNo branch is ever force-pushed. Inspect any existing update branch and workflow evidence before retrying.\n\n'+manual(e.TARGET),['platform-update',...severity]);
              core.setFailed('Update delivery requires attention; see the issue and workflow evidence.');
            }
