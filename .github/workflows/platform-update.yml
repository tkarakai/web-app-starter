name: Platform Update

on:
  workflow_call:
    inputs:
      policy:
        type: string
        default: minor
      version:
        type: string
        default: ""
      auto-merge:
        type: boolean
        default: false
      source:
        description: Public platform release repository
        type: string
        default: tkarakai/web-app-starter
    secrets:
      PLATFORM_UPDATER_PRIVATE_KEY:
        required: false

concurrency:
  group: platform-update-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(vars.PLATFORM_UPDATE_RUNNER != '' && format('["self-hosted","{0}","starter-source-{1}","starter-run-{2}","starter-attempt-{3}","starter-update-check"]', vars.PLATFORM_UPDATE_RUNNER, github.sha, github.run_id, github.run_attempt) || format('["{0}"]', vars.PLATFORM_CI_AUX_RUNNER || vars.PLATFORM_CI_RUNNER || ((vars.PLATFORM_CI_LOCAL_ONLY == 'true' || vars.PLATFORM_CI_WORKER_POOL != '' || vars.PLATFORM_CI_AUX_RUNNER != '' || vars.PLATFORM_CI_RUNNER != '' || vars.PLATFORM_UPDATE_RUNNER != '' || vars.PLATFORM_UPDATE_DELIVERY_RUNNER != '') && 'starter-local-only-unconfigured' || 'ubuntu-latest'))) }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head: ${{ steps.release.outputs.head }}
      target: ${{ steps.release.outputs.target }}
      major: ${{ steps.release.outputs.major }}
      advisory: ${{ steps.release.outputs.advisory }}
      base: ${{ steps.release.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - if: env.STARTER_WORKER != '1'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Discover releases and advisories
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
          POLICY: ${{ inputs.policy }}
          VERSION: ${{ inputs.version }}
        run: |
          args=(--repo "$SOURCE" --policy "$POLICY" --report "$RUNNER_TEMP/discovery.json")
          if [ -n "$VERSION" ]; then args+=(--to "$VERSION"); fi
          node platform/tooling/update-check.ts "${args[@]}"
      - name: Pin app identity and skip an existing update PR
        id: release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs'), cp = require('node:child_process');
            const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/discovery.json', 'utf8'));
            core.setOutput('head', cp.execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim());
            core.setOutput('base', context.payload.repository.default_branch);
            if (result.advisoryRelease) core.setOutput('advisory', result.advisoryRelease.version);
            if (result.major) core.setOutput('major', result.major.version);
            if (result.target) {
              const existing = await github.rest.pulls.list({...context.repo, state:'open', head:context.repo.owner + ':platform-update/v' + result.target.version});
              if (existing.data.length) core.notice('Existing update PR: ' + existing.data[0].html_url);
              else core.setOutput('target', result.target.version);
            }
            if (result.outcome === 'no-releases') throw Error('No published advisory source is available yet.');
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-discovery
          path: ${{ runner.temp }}/discovery.json
          retention-days: 14

  verify:
    needs: check
    if: needs.check.outputs.target != ''
    runs-on: ${{ fromJSON(vars.PLATFORM_UPDATE_RUNNER != '' && format('["self-hosted","{0}","starter-source-{1}","starter-run-{2}","starter-attempt-{3}","starter-update-verify"]', vars.PLATFORM_UPDATE_RUNNER, needs.check.outputs.head, github.run_id, github.run_attempt) || format('["{0}"]', vars.PLATFORM_CI_AUX_RUNNER || vars.PLATFORM_CI_RUNNER || ((vars.PLATFORM_CI_LOCAL_ONLY == 'true' || vars.PLATFORM_CI_WORKER_POOL != '' || vars.PLATFORM_CI_AUX_RUNNER != '' || vars.PLATFORM_CI_RUNNER != '' || vars.PLATFORM_UPDATE_RUNNER != '' || vars.PLATFORM_UPDATE_DELIVERY_RUNNER != '') && 'starter-local-only-unconfigured' || 'ubuntu-latest'))) }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CI: true
      CONVEX_AGENT_MODE: anonymous
      CONVEX_URL: http://127.0.0.1:3210
      CONVEX_SITE_URL: http://127.0.0.1:3211
      NEXT_PUBLIC_CONVEX_SITE_URL: http://127.0.0.1:3211
      NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Seed local origins for optional app builds
        run: |
          ./platform/tooling/ensure-app-env.sh --quiet
          echo "LANDING_URL=$APP_CONFIG_ORIGIN_LANDING" >> "$GITHUB_ENV"
      # This entire job has only a read token. No App key or write token is in its env.
      - name: Plan, apply and verify without E2E
        id: upgrade
        env:
          SOURCE: ${{ inputs.source }}
          TARGET: ${{ needs.check.outputs.target }}
          ADVISORY: ${{ needs.check.outputs.advisory }}
        run: |
          test ! -e upgrade-report.json && test ! -e upgrade-report.md
          mkdir -p "$RUNNER_TEMP/platform-delivery"
          set +e
          bun run platform:upgrade --to "v$TARGET" --source "$SOURCE" --advisory-release "$ADVISORY" --non-interactive --defer-e2e --report upgrade-report.json > "$RUNNER_TEMP/platform-delivery/upgrade.log" 2>&1
          status=$?
          set -e
          tail -c 12000 "$RUNNER_TEMP/platform-delivery/upgrade.log"
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then exit "$status"; fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('upgrade-report.json','utf8'));
          const ready=r.state.stage==='installed' && !r.plan.gates.some(g=>!r.state.decisions.some(d=>d.gateId===g.id));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'e2e='+ready+'\n');
          NODE
      - name: Install the target's browser builds
        if: steps.upgrade.outputs.e2e == 'true'
        run: |
          if [ "${STARTER_WORKER:-}" = "1" ]; then
            echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/platform-browsers" >> "$GITHUB_ENV"
          fi
          for app in apps/* platform/apps/*; do
            if [ -x "$app/node_modules/.bin/playwright" ]; then
              if [ "${STARTER_WORKER:-}" = "1" ]; then
                (cd "$app" && PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/platform-browsers" ./node_modules/.bin/playwright install chromium)
              else
                (cd "$app" && ./node_modules/.bin/playwright install --with-deps chromium)
              fi
            fi
          done
      - name: Finish E2E verification and record the baseline
        if: steps.upgrade.outputs.e2e == 'true'
        run: bun run platform:upgrade --resume upgrade-report.json >> "$RUNNER_TEMP/platform-delivery/upgrade.log" 2>&1
      - name: Package exact staged changes for delivery
        run: node platform/tooling/platform-update-artifact.ts "$RUNNER_TEMP/platform-delivery"
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-delivery
          path: ${{ runner.temp }}/platform-delivery/
          retention-days: 14
          if-no-files-found: warn
      - name: Retain the report even when verification fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-verification-report
          path: |
            upgrade-report.json
            upgrade-report.md
          retention-days: 14
          if-no-files-found: warn

  deliver:
    needs: [check, verify]
    if: >-
      always() && !cancelled() && needs.check.result != 'skipped' &&
      (needs.check.result == 'failure' || needs.check.outputs.target != '' || needs.check.outputs.major != '')
    runs-on: ${{ fromJSON(vars.PLATFORM_UPDATE_DELIVERY_RUNNER != '' && format('["self-hosted","{0}","starter-source-{1}","starter-run-{2}","starter-attempt-{3}","starter-update-deliver"]', vars.PLATFORM_UPDATE_DELIVERY_RUNNER, needs.check.outputs.head || github.sha, github.run_id, github.run_attempt) || format('["{0}"]', vars.PLATFORM_CI_AUX_RUNNER || vars.PLATFORM_CI_RUNNER || ((vars.PLATFORM_CI_LOCAL_ONLY == 'true' || vars.PLATFORM_CI_WORKER_POOL != '' || vars.PLATFORM_CI_AUX_RUNNER != '' || vars.PLATFORM_CI_RUNNER != '' || vars.PLATFORM_UPDATE_RUNNER != '' || vars.PLATFORM_UPDATE_DELIVERY_RUNNER != '') && 'starter-local-only-unconfigured' || 'ubuntu-latest'))) }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Mint an App token only after verification has finished
        id: app-token
        if: vars.PLATFORM_UPDATER_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PLATFORM_UPDATER_APP_ID }}
          private-key: ${{ secrets.PLATFORM_UPDATER_PRIVATE_KEY }}
          # Scope the token to this repository. It inherits only the installed App grants,
          # including separately owner-approved read-only inspection scopes when present.
          repositories: ${{ github.event.repository.name }}
      - name: Report updater App authentication failure
        if: failure() && steps.app-token.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title='Platform updater App authentication needs attention';
            const body='GitHub scheduled or manually dispatched the platform updater, but it could not authenticate the configured App. It did not switch to the built-in token, push an update branch, approve a PR, merge or deploy anything. Installed default-branch version is unchanged.\n\nInspect .github/update-delivery.json and run `bun run platform:setup-updates --check`. Repair the existing PLATFORM_UPDATER_APP_ID / PLATFORM_UPDATER_PRIVATE_KEY configuration and App installation; secret presence alone does not prove key validity. Do not paste the key into logs or chat. [Workflow evidence](https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId+').';
            const issues=await github.paginate(github.rest.issues.listForRepo,{...context.repo,state:'open',per_page:100});
            const found=issues.find(row=>!row.pull_request&&row.title===title);
            if(found)await github.rest.issues.update({...context.repo,issue_number:found.number,body});
            else await github.rest.issues.create({...context.repo,title,body});
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.head || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.check.result == 'success'
        with:
          name: platform-discovery
          path: ${{ runner.temp }}/discovery
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.verify.result == 'success'
        with:
          name: platform-delivery
          path: ${{ runner.temp }}/delivery
      # Only this inline workflow code, pinned actions and Git run with write credentials.
      # Do not replace this with a script, action, hook or package from the app/artifact.
      - name: Validate artifact and publish a PR or issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          BASE_HEAD: ${{ needs.check.outputs.head }}
          BASE_BRANCH: ${{ needs.check.outputs.base }}
          TARGET: ${{ needs.check.outputs.target }}
          MAJOR: ${{ needs.check.outputs.major }}
          SOURCE: ${{ inputs.source }}
          AUTO_MERGE: ${{ inputs.auto-merge }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          DELIVERY_MODE: ${{ vars.PLATFORM_UPDATE_DELIVERY }}
          APP_ID: ${{ vars.PLATFORM_UPDATER_APP_ID }}
          APP_BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          UPDATE_POLICY: ${{ inputs.policy }}
          PR_E2E: ${{ vars.PLATFORM_CI_PR_E2E || 'always' }}
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const fs=require('node:fs'), cp=require('node:child_process'), crypto=require('node:crypto');
            const e=process.env, runURL=`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const requireThat=(ok,message)=>{if(!ok)throw Error(message);};
            const semver=/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
            requireThat(/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(e.SOURCE),'Invalid platform source');
            const read=(file,max)=>{const s=fs.lstatSync(file);requireThat(s.isFile()&&!s.isSymbolicLink()&&s.size<=max,'Invalid artifact file');return fs.readFileSync(file);};
            const sha=bytes=>crypto.createHash('sha256').update(bytes).digest('hex');
            const git=(args,options={})=>cp.execFileSync('git',['-c','core.hooksPath=/dev/null','-c','commit.gpgsign=false',...args],{encoding:'utf8',maxBuffer:40*1024*1024,...options}).trim();
            const ensureLabels=async names=>{for(const name of names){try{await github.rest.issues.getLabel({...context.repo,name});}catch(error){if(error.status!==404)throw error;await github.rest.issues.createLabel({...context.repo,name,color:name.startsWith('severity:')?'b60205':'0e8a16'});}}};
            const issue=async(title,body,labels)=>{
              const existing=await github.paginate(github.rest.issues.listForRepo,{...context.repo,state:'open',labels:'platform-update',per_page:100});
              const found=existing.find(row=>!row.pull_request&&row.title===title);
              if(found){await github.rest.issues.update({...context.repo,issue_number:found.number,body:body+'\n\n[Latest workflow evidence]('+runURL+')'});core.notice('Existing issue updated: '+title);return;}
              await ensureLabels(labels);await github.rest.issues.create({...context.repo,title,body:body+'\n\n[Workflow evidence]('+runURL+')',labels});
            };
            const manual=version=>'`bun run platform:upgrade --to v'+version+' --source '+e.SOURCE+' --non-interactive --report upgrade-report.json`';
            if(e.CHECK_RESULT!=='success'){
              await issue('Platform update discovery failed','Release discovery failed. Inspect the workflow evidence and rerun after correcting the source or access.',['platform-update']);return;
            }
            const discovery=JSON.parse(read(e.RUNNER_TEMP+'/discovery/discovery.json',5*1024*1024));
            requireThat(discovery.schemaVersion===1&&discovery.source===e.SOURCE,'Discovery source mismatch');
            const severity=['low','medium','high','critical'].includes(discovery.severity)?['severity:'+discovery.severity]:[];
            if(e.MAJOR){
              requireThat(semver.test(e.MAJOR)&&discovery.major?.version===e.MAJOR,'Invalid major identity');
              await issue('Platform v'+e.MAJOR+' needs a major-upgrade review',`Review [release notes](https://github.com/${e.SOURCE}/releases/tag/v${e.MAJOR}) and [breaking changes](https://github.com/${e.SOURCE}/releases/download/v${e.MAJOR}/breaking-changes.json).\n\n${manual(e.MAJOR)}`,['platform-update','breaking',...severity]);
            }
            if(!e.TARGET)return;
            requireThat(semver.test(e.TARGET)&&discovery.target?.version===e.TARGET,'Invalid target identity');
            if(e.VERIFY_RESULT!=='success'){
              await issue('Platform v'+e.TARGET+' upgrade failed','The verifier could not certify this update. Inspect its retained report/log before retrying.\n\n'+manual(e.TARGET),['platform-update',...severity]);return;
            }
            let pushed=false, operation='validate artifact', deliveredOutcome='unknown', deliveredStage='unknown', reviewItems=0;
            const branch='platform-update/v'+e.TARGET;
            const compareURL='https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/compare/'+encodeURIComponent(e.BASE_BRANCH)+'...'+encodeURIComponent(branch)+'?expand=1';
            const credentialMode=e.APP_TOKEN?'dedicated App (ID '+(e.APP_ID||'configured')+')':'built-in GITHUB_TOKEN (github-actions[bot])';
            try {
              requireThat(e.DELIVERY_MODE!=='app'||!!e.APP_TOKEN,'Chosen App mode has no authenticated App token; repair credentials, never silently switch to fallback');
              requireThat(e.DELIVERY_MODE!=='fallback'||!e.APP_TOKEN,'Chosen fallback mode still has an App identity; inspect setup before switching credentials');
              if(!e.APP_TOKEN){
                operation='check PR-creation permission';
                try {
                  const settings=await github.request('GET /repos/{owner}/{repo}/actions/permissions/workflow',context.repo);
                  requireThat(settings.data.can_approve_pull_request_reviews!==false,'GitHub Actions PR creation is disabled. An owner must run bun run platform:setup-updates --fallback --yes or inspect https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/settings/actions. This is the create/approve capability; the updater submits no approvals.');
                } catch(error) {
                  // Routine tokens have no Administration permission. Unknown is not success or a reason to broaden access.
                  if(error.status===403||error.status===404)core.notice('PR-creation setting is unknown with this least-privilege token; delivery may still be denied.');
                  else throw error;
                }
              }
              operation='validate artifact';
              const directory=e.RUNNER_TEMP+'/delivery/', data=JSON.parse(read(directory+'delivery.json',1024*1024));
              const patch=read(directory+'update.patch',32*1024*1024), markdown=read(directory+'report.md',8*1024*1024);
              requireThat(data.schemaVersion===1&&data.baseHead===e.BASE_HEAD&&data.target===e.TARGET&&data.installed===discovery.installed,'Delivery identity mismatch');
              requireThat(['verified','needs-review'].includes(data.outcome)&&/^[a-f0-9]{40}$/.test(data.tree)&&/^[a-f0-9]{40}$/.test(data.targetCommit)&&/^[a-f0-9]{64}$/.test(data.planDigest),'Invalid verification result');
              requireThat(sha(patch)===data.patchDigest&&sha(markdown)===data.markdownDigest,'Artifact digest mismatch');
              const permitted=['platform-update','breaking','migration','new-env','severity:low','severity:medium','severity:high','severity:critical'];
              requireThat(Array.isArray(data.labels)&&data.labels.every(name=>permitted.includes(name)),'Unexpected update labels');
              const existing=await github.rest.pulls.list({...context.repo,state:'open',head:context.repo.owner+':'+branch});
              if(existing.data.length){core.notice('Existing PR: '+existing.data[0].html_url);return;}
              const current=await github.rest.repos.getBranch({...context.repo,branch:e.BASE_BRANCH});
              requireThat(current.data.commit.sha===e.BASE_HEAD,'App base advanced during verification; rerun to make a fresh plan');
              requireThat(git(['rev-parse','HEAD'])===e.BASE_HEAD,'Delivery checkout identity mismatch');
              git(['apply','--index','--binary','--whitespace=nowarn',directory+'update.patch']);
              requireThat(git(['write-tree'])===data.tree,'Applied tree differs from verified artifact');
              const changed=git(['diff','--cached','--name-only','-z']).split('\0').filter(Boolean);
              const report=JSON.parse(git(['show',':upgrade-report.json']));
              deliveredOutcome=report.outcome; deliveredStage=report.state.stage; reviewItems=report.plan.gates.filter(g=>!report.state.decisions.some(d=>d.gateId===g.id)).length;
              requireThat(report.plan.digest===data.planDigest&&report.plan.target.commit===data.targetCommit&&report.outcome===data.outcome,'Report does not match delivery metadata');
              if(!e.APP_TOKEN&&changed.some(file=>file.startsWith('.github/workflows/'))){
                await issue('Platform v'+e.TARGET+' needs a workflow-capable token','This release changes workflow files. Configure the updater GitHub App or run locally:\n\n'+manual(e.TARGET),['platform-update',...severity]);return;
              }
              operation='push update branch';
              git(['switch','-c',branch]);
              git(['-c','user.name=platform-updater[bot]','-c','user.email=platform-updater[bot]@users.noreply.github.com','commit','-m','Update platform to v'+e.TARGET]);
              // The credential is transient; never persist it or include it in process arguments.
              const token=e.APP_TOKEN||core.getInput('github-token',{required:true});
              const pushEnv={...e,GIT_CONFIG_COUNT:'1',GIT_CONFIG_KEY_0:'http.https://github.com/.extraheader',GIT_CONFIG_VALUE_0:'AUTHORIZATION: basic '+Buffer.from('x-access-token:'+token).toString('base64')};
              git(['push','origin','HEAD:refs/heads/'+branch],{env:pushEnv});
              pushed=true; operation='prepare PR labels';
              const labels=[...new Set([...data.labels,...severity])];await ensureLabels(labels);
              const draft=data.outcome!=='verified';
              const recovery=draft?'\n\nCheck out this branch, then run `bun run platform:upgrade --resume upgrade-report.json --relocate` before making review edits. Resolve each reported item and resume; keep the PR draft until verification succeeds.':'';
              const fallback=e.APP_TOKEN?'':'\n\nBuilt-in GITHUB_TOKEN PRs may require **Approve workflows to run** in the PR banner before CI starts. Approving a workflow run, approving a PR review, and enabling Actions PR creation are separate operations. Other token-triggered events (such as labels) do not start CI. Confirm every required check before merging.';
              const body=markdown.toString('utf8').slice(0,45000)+recovery+fallback+'\n\n[Verification evidence]('+runURL+')';
              operation='create '+(draft?'draft':'ready')+' PR';
              const pr=await github.rest.pulls.create({...context.repo,head:branch,base:e.BASE_BRANCH,draft,title:`Platform v${data.installed} → v${e.TARGET}${severity.length?' (security: '+discovery.severity+')':''}`,body});
              operation='label created PR';
              await github.rest.issues.addLabels({...context.repo,issue_number:pr.data.number,labels});core.notice(pr.data.html_url);
              // Only the committed owner policy may authorize this exact named App and bot class.
              // Never execute repository/artifact scripts in this credential-bearing publisher.
              const maintenanceReady=async()=>{
                try{
                  const policy=JSON.parse(git(['show',e.BASE_HEAD+':.github/repository-workflow.json']));
                  const login=e.APP_BOT_LOGIN;
                  const bot=policy.maintenanceBots?.find(b=>b.login===login&&b.appId===Number(e.APP_ID)&&b.kind==='platform-update');
                  if(policy.schemaVersion!==1||policy.repository!==context.repo.owner+'/'+context.repo.repo||!bot||!login?.endsWith('[bot]')||!['patch','minor'].includes(bot.policy))return false;
                  const app=(await github.rest.apps.getBySlug({app_slug:login.replace(/\[bot\]$/,'')})).data;
                  const allowed={contents:'write',pull_requests:'write',workflows:'write',issues:'write',metadata:'read',administration:'read',checks:'read',variables:'read'};
                  if(app.id!==bot.appId||Object.entries(app.permissions??{}).some(([key,value])=>allowed[key]!==value)||Object.entries(allowed).some(([key,value])=>app.permissions?.[key]!==value))return false;
                  if(e.UPDATE_POLICY!==bot.policy||!['always','on-demand'].includes(e.PR_E2E||'always'))return false;
                  const before=data.installed.split('.').map(Number),after=e.TARGET.split('.').map(Number);
                  if(before[0]!==after[0]||(bot.policy==='patch'&&before[1]!==after[1]))return false;
                  const repo=(await github.rest.repos.get(context.repo)).data;
                  if(repo.default_branch!==e.BASE_BRANCH||repo.allow_auto_merge!==true||repo.allow_squash_merge!==true||repo.allow_merge_commit!==false||repo.allow_rebase_merge!==false||repo.delete_branch_on_merge!==true)return false;
                  const installation=(await github.request('GET /installation/repositories',{per_page:100})).data;
                  if(installation.total_count!==1||installation.repositories?.length!==1||installation.repositories[0].full_name!==policy.repository||pr.data.user?.login!==login)return false;
                  const rules=(await github.paginate('GET /repos/{owner}/{repo}/rules/branches/{branch}',{...context.repo,branch:e.BASE_BRANCH,per_page:100}));
                  if(!Array.isArray(rules))return false;
                  let protection;
                  try{protection=(await github.rest.repos.getBranchProtection({...context.repo,branch:e.BASE_BRANCH})).data;}catch(error){if(error.status!==404)throw error;}
                  const effective={pr:false,linear:false,strict:false,approvals:0,stale:false,checks:[]};
                  if(protection){
                    const reviews=protection.required_pull_request_reviews,bypass=reviews?.bypass_pull_request_allowances;
                    if(protection.allow_force_pushes?.enabled||protection.allow_deletions?.enabled)return false;
                    if(bypass&&['users','teams','apps'].some(key=>bypass[key]?.length))return false;
                    if(protection.enforce_admins?.enabled){
                      effective.pr=Boolean(reviews);effective.linear=protection.required_linear_history?.enabled===true;
                      effective.strict=protection.required_status_checks?.strict===true;effective.approvals=reviews?.required_approving_review_count??0;
                      effective.stale=reviews?.dismiss_stale_reviews===true;effective.checks.push(...(protection.required_status_checks?.checks??[]));
                    }
                  }
                  for(const id of new Set(rules.map(r=>r.ruleset_id))){
                    const rule=rules.find(r=>r.ruleset_id===id);
                    if(!Number.isInteger(id)||!rule.ruleset_source||!rule.ruleset_source_type)return false;
                    let endpoint;
                    if(rule.ruleset_source_type==='Repository'&&rule.ruleset_source===policy.repository)endpoint='GET /repos/{owner}/{repo}/rulesets/{ruleset_id}';
                    else if(rule.ruleset_source_type==='Organization'&&/^[A-Za-z0-9_.-]+$/.test(rule.ruleset_source))endpoint='GET /orgs/{org}/rulesets/{ruleset_id}';
                    else return false;
                    const detail=(await github.request(endpoint,{...context.repo,org:rule.ruleset_source,ruleset_id:id})).data;
                    if(detail.id!==id||detail.enforcement!=='active'||!Array.isArray(detail.bypass_actors)||detail.bypass_actors.length)return false;
                    for(const r of rules.filter(r=>r.ruleset_id===id)){
                      if(r.type==='required_linear_history')effective.linear=true;
                      if(r.type==='pull_request'){effective.pr=true;effective.approvals=Math.max(effective.approvals,r.parameters?.required_approving_review_count??0);effective.stale ||= r.parameters?.dismiss_stale_reviews_on_push===true;}
                      if(r.type==='required_status_checks'){effective.strict ||= r.parameters?.strict_required_status_checks_policy===true;effective.checks.push(...(r.parameters?.required_status_checks??[]).map(c=>({context:c.context,app_id:c.integration_id})));}
                    }
                  }
                  if(!Number.isInteger(policy.approvals)||policy.approvals<0||typeof policy.dismissStaleReviews!=='boolean')return false;
                  if(!effective.pr||!effective.linear||!effective.strict||effective.approvals<policy.approvals||!effective.stale)return false;
                  const files=git(['ls-tree','-r','--name-only',e.BASE_HEAD]).split('\n');
                  const expected=['CI Shared Complete','Security Complete',...['web','admin','landing','storybook'].filter(app=>files.includes((app==='admin'||app==='storybook'?'platform/':'')+'apps/'+app+'/package.json')).map(app=>'CI '+app[0].toUpperCase()+app.slice(1)+' Complete'),...(repo.private?[]:['CodeQL'])];
                  const installed=effective.checks;
                  // Bind contexts to their discovered Actions App; arbitrary similarly named statuses are insufficient.
                  return expected.every(label=>{
                    const found=policy.discovery?.checks?.find(c=>c.label===label);
                    return found&&Number.isInteger(found.appId)&&found.appId>0&&installed?.some(c=>c.context===found.context&&c.app_id===found.appId);
                  });
                }catch{core.notice('Maintenance auto-merge denied: live enforcement, named App identity or committed policy could not be verified.');return false;}
              };
              if(e.AUTO_MERGE==='true'&&e.APP_TOKEN&&!draft&&data.autoMergeEligible===true&&severity.length===0){
                if(!await maintenanceReady())core.notice('Maintenance auto-merge denied; owner/independent reviewer must merge after CI.');
                else try{await github.graphql('mutation($id:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:SQUASH}){pullRequest{id}}}',{id:pr.data.node_id});}catch{core.notice('Auto-merge unavailable; merge manually after CI.');}
              }
            } catch(error) {
              const recovery=pushed
                ? 'The scheduled platform updater pushed branch `'+branch+'`, but failed to '+operation+'. It did not submit a PR approval or merge/deploy the update. The default branch installed version remains v'+discovery.installed+'.\n\nCredential mode: '+credentialMode+'. Report outcome: '+deliveredOutcome+'; stage: '+deliveredStage+'; unresolved review items: '+reviewItems+'. A green preparation job can mean a review plan was produced; it does not certify all checks or E2E.\n\nRun `bun run platform:setup-updates --check` and finish owner setup. [Open the existing branch as a draft PR]('+compareURL+'); if a PR was already created, use it. Inspect its `upgrade-report.md` and `upgrade-report.json`. Check out the branch, then run `bun run platform:upgrade --resume upgrade-report.json --relocate` before review edits. Keep it draft until every gate and check passes. Do not blindly rerun delivery into this branch.'
                : 'No update branch was pushed by this attempt. Failed operation: '+operation+'. Credential mode: '+credentialMode+'. Run `bun run platform:setup-updates --check` and inspect the retained evidence before retrying.\n\n'+manual(e.TARGET);
              await issue('Platform v'+e.TARGET+' delivery needs attention',recovery+'\n\nGitHub diagnostic: '+String(error.message).slice(0,2000)+'\n\nNo branch is ever force-pushed.',['platform-update',...severity]);
              core.setFailed('Update delivery requires attention; see the issue and workflow evidence.');
            }
