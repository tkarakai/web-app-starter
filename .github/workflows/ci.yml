name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prevent Playwright from downloading browsers on every run
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

# =============================================================================
# OFFLINE MODE SUPPORT (using "act")
# =============================================================================
# This workflow supports offline execution when run locally via `act`.
# The `env.ACT` variable is automatically set by act.
#
# Pattern for tools that download from the internet:
# 1. Use `if: ${{ !env.ACT }}` for standard GitHub Actions setup
# 2. Use `if: ${{ env.ACT }}` for act-specific cache-aware setup
# 3. Check if tool exists before downloading (enables offline mode)
# 4. Install to paths mounted as Docker volumes by ci-local-act.sh
#
# See scripts/ci-local-act.sh for the Docker volumes for the caches.
#
# See CLAUDE.md "Offline CI Mode (act)" for full documentation.
# =============================================================================

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        if: ${{ !env.ACT }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Setup Bun (act)
        if: ${{ env.ACT }}
        run: |
          BUN_VERSION="1.3.6"
          BUN_DIR="/root/.bun"
          if [ -x "$BUN_DIR/bin/bun" ]; then
            echo "Bun already installed at $BUN_DIR"
          else
            echo "Installing Bun $BUN_VERSION..."
            curl -fsSL https://bun.sh/install | bash -s "bun-v$BUN_VERSION"
          fi
          echo "$BUN_DIR/bin" >> $GITHUB_PATH

      - name: Cache dependencies
        if: ${{ !env.ACT }}
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript check
        run: bunx tsc --noEmit

      - name: Run ESLint
        run: bun run lint

  test-unit:
    name: Unit Tests (Bun)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        if: ${{ !env.ACT }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Setup Bun (act)
        if: ${{ env.ACT }}
        run: |
          BUN_DIR="/root/.bun"
          if [ -x "$BUN_DIR/bin/bun" ]; then
            echo "Bun already installed"
          else
            curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.6"
          fi
          echo "$BUN_DIR/bin" >> $GITHUB_PATH

      - name: Cache dependencies
        if: ${{ !env.ACT }}
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Bun tests
        run: bun run test

  test-vitest:
    name: Component Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        if: ${{ !env.ACT }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Setup Bun (act)
        if: ${{ env.ACT }}
        run: |
          BUN_DIR="/root/.bun"
          if [ -x "$BUN_DIR/bin/bun" ]; then
            echo "Bun already installed"
          else
            curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.6"
          fi
          echo "$BUN_DIR/bin" >> $GITHUB_PATH

      - name: Cache dependencies
        if: ${{ !env.ACT }}
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Vitest with coverage
        run: bun run test:coverage

      - name: Display coverage summary
        if: always()
        run: |
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
            echo "| Lines | $(jq -r '.total.lines.pct' coverage/coverage-summary.json)% |" >> $GITHUB_STEP_SUMMARY
            echo "| Branches | $(jq -r '.total.branches.pct' coverage/coverage-summary.json)% |" >> $GITHUB_STEP_SUMMARY
            echo "| Functions | $(jq -r '.total.functions.pct' coverage/coverage-summary.json)% |" >> $GITHUB_STEP_SUMMARY
            echo "| Statements | $(jq -r '.total.statements.pct' coverage/coverage-summary.json)% |" >> $GITHUB_STEP_SUMMARY
          else
            echo "No coverage summary found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  test-convex:
    name: Backend Tests (Convex)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        if: ${{ !env.ACT }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Setup Bun (act)
        if: ${{ env.ACT }}
        run: |
          BUN_DIR="/root/.bun"
          if [ -x "$BUN_DIR/bin/bun" ]; then
            echo "Bun already installed"
          else
            curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.6"
          fi
          echo "$BUN_DIR/bin" >> $GITHUB_PATH

      - name: Cache dependencies
        if: ${{ !env.ACT }}
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Convex tests
        run: bun run test:convex

  test-e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        if: ${{ !env.ACT }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Setup Bun (act)
        if: ${{ env.ACT }}
        run: |
          BUN_DIR="/root/.bun"
          if [ -x "$BUN_DIR/bin/bun" ]; then
            echo "Bun already installed"
          else
            curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.6"
          fi
          echo "$BUN_DIR/bin" >> $GITHUB_PATH

      - name: Cache dependencies
        if: ${{ !env.ACT }}
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        if: ${{ !env.ACT }}
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true' || env.ACT
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright deps (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true' && !env.ACT
        run: bunx playwright install-deps chromium

      - name: Run Playwright tests
        run: bunx playwright test --project=chromium
        env:
          CI: true

      - name: Show dev logs on failure
        if: failure()
        run: |
          echo "=== Convex Dev Log ==="
          cat .convex-dev.log 2>/dev/null || echo "No Convex log found"
          echo ""
          echo "=== Next.js Dev Log ==="
          cat .next-dev.log 2>/dev/null || echo "No Next.js log found"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload dev logs
        uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: dev-logs
          path: |
            .convex-dev.log
            .next-dev.log
          retention-days: 7

      - name: Upload visual snapshots
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: visual-snapshots
          path: e2e/__screenshots__/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-vitest, test-convex]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        if: ${{ !env.ACT }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Setup Bun (act)
        if: ${{ env.ACT }}
        run: |
          BUN_DIR="/root/.bun"
          if [ -x "$BUN_DIR/bin/bun" ]; then
            echo "Bun already installed"
          else
            curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.6"
          fi
          echo "$BUN_DIR/bin" >> $GITHUB_PATH

      - name: Cache dependencies
        if: ${{ !env.ACT }}
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_CONVEX_URL: "https://placeholder.convex.cloud"
          NEXT_PUBLIC_CONVEX_SITE_URL: "https://placeholder.convex.site"

  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        if: ${{ !env.ACT }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Setup Bun (act)
        if: ${{ env.ACT }}
        run: |
          BUN_DIR="/root/.bun"
          if [ -x "$BUN_DIR/bin/bun" ]; then
            echo "Bun already installed"
          else
            curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.6"
          fi
          echo "$BUN_DIR/bin" >> $GITHUB_PATH

      - name: Cache dependencies
        if: ${{ !env.ACT }}
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_CONVEX_URL: "https://placeholder.convex.cloud"
          NEXT_PUBLIC_CONVEX_SITE_URL: "https://placeholder.convex.site"

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          NEXT_PUBLIC_CONVEX_URL: "https://placeholder.convex.cloud"
          NEXT_PUBLIC_CONVEX_SITE_URL: "https://placeholder.convex.site"

  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        if: ${{ !env.ACT }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Setup Bun (act)
        if: ${{ env.ACT }}
        run: |
          BUN_DIR="/root/.bun"
          if [ -x "$BUN_DIR/bin/bun" ]; then
            echo "Bun already installed"
          else
            curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.6"
          fi
          echo "$BUN_DIR/bin" >> $GITHUB_PATH

      - name: Cache dependencies
        if: ${{ !env.ACT }}
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_CONVEX_URL: "https://placeholder.convex.cloud"
          NEXT_PUBLIC_CONVEX_SITE_URL: "https://placeholder.convex.site"

      - name: Check bundle size
        run: bun run size

      - name: Report bundle size
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          bun run size 2>&1 || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # Summary job for branch protection - provides single status check
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-vitest, test-convex, build]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Unit Tests: ${{ needs.test-unit.result }}"
          echo "Vitest: ${{ needs.test-vitest.result }}"
          echo "Convex: ${{ needs.test-convex.result }}"
          echo "Build: ${{ needs.build.result }}"

          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test-unit.result }}" != "success" ]] || \
             [[ "${{ needs.test-vitest.result }}" != "success" ]] || \
             [[ "${{ needs.test-convex.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "❌ One or more jobs failed"
            exit 1
          fi

          echo "✅ All CI jobs passed successfully"
