name: CI Web

# App-owned caller. The checks live in the platform's reusable workflow
# (platform-ci-web.yml, replaced on platform upgrade); edit the triggers here.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  platform:
    name: Platform
    uses: ./.github/workflows/platform-ci-web.yml

  # The required status check (branch rules name it).
  complete:
    name: CI Web Complete
    needs: [platform]
    if: always()
    runs-on: ${{ fromJSON(github.event.repository.private != true && '["ubuntu-latest"]' || (vars.PLATFORM_CI_WORKER_POOL != '' && format('["self-hosted","{0}","starter-source-{1}","starter-run-{2}"]', vars.PLATFORM_CI_WORKER_POOL, github.sha, github.run_id) || ((vars.PLATFORM_CI_LOCAL_ONLY == 'true' || vars.PLATFORM_CI_WORKER_POOL != '' || vars.PLATFORM_CI_AUX_RUNNER != '' || vars.PLATFORM_CI_RUNNER != '' || vars.PLATFORM_UPDATE_RUNNER != '' || vars.PLATFORM_UPDATE_DELIVERY_RUNNER != '') && format('["self-hosted",{0}]', toJSON(vars.PLATFORM_CI_AUX_RUNNER || vars.PLATFORM_CI_RUNNER || 'starter-local-only-unconfigured')) || '["ubuntu-latest"]'))) }}
    steps:
      - name: Require the platform workflow to pass
        run: |
          echo "Platform CI Web: ${{ needs.platform.result }}"
          [[ "${{ needs.platform.result }}" == "success" ]]
