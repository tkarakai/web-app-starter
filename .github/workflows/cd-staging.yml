name: Deploy Staging

run-name: "Deploy staging ${{ inputs.git_sha || github.sha }} [ops:${{ inputs.request_id || github.run_id }}]"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation ID supplied by the ops CLI
        type: string
        required: false
      git_sha:
        description: Full source SHA to test and deploy (defaults to workflow SHA)
        type: string
        required: false
      force_deploy:
        description: 'Deploy all apps regardless of change detection'
        required: false
        type: boolean
        default: true

env:
  OPS_SELECTED_SHA: ${{ inputs.git_sha || github.sha }}

permissions:
  contents: write
  actions: read
  deployments: write
  statuses: write
  id-token: write
  attestations: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  validate-source:
    name: Validate Source SHA
    runs-on: ubuntu-latest
    steps:
      - name: Require an immutable full commit SHA
        shell: bash
        run: |
          if [[ ! "$OPS_SELECTED_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::git_sha must be a full 40-character commit SHA."
            exit 1
          fi

  # ─── CI Phase (reusable workflows, parallel) ───────────────────
  ci-shared:
    needs: validate-source
    uses: ./.github/workflows/ci-shared.yml
    with:
      git_sha: ${{ inputs.git_sha }}

  ci-web:
    needs: validate-source
    uses: ./.github/workflows/ci-web.yml
    with:
      git_sha: ${{ inputs.git_sha }}

  ci-admin:
    needs: validate-source
    uses: ./.github/workflows/ci-admin.yml
    with:
      git_sha: ${{ inputs.git_sha }}

  ci-landing:
    needs: validate-source
    uses: ./.github/workflows/ci-landing.yml
    with:
      git_sha: ${{ inputs.git_sha }}

  # ─── CI Gate ────────────────────────────────────────────────────
  ci-gate:
    name: CI Gate
    needs: [ci-shared, ci-web, ci-admin, ci-landing]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate CI and set commit status
        env:
          SELECTED_SHA: ${{ inputs.git_sha || github.sha }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const results = {
              shared: '${{ needs.ci-shared.result }}',
              web: '${{ needs.ci-web.result }}',
              admin: '${{ needs.ci-admin.result }}',
              landing: '${{ needs.ci-landing.result }}',
            };

            console.log('CI Results:', JSON.stringify(results, null, 2));

            const allPassed = Object.values(results).every(r => r === 'success');

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.SELECTED_SHA,
              state: allPassed ? 'success' : 'failure',
              context: 'ci/gate-passed',
              description: allPassed
                ? 'All CI workflows passed'
                : `CI failed: ${Object.entries(results).filter(([,r]) => r !== 'success').map(([k,r]) => `${k}=${r}`).join(', ')}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

            if (!allPassed) {
              core.setFailed('One or more CI workflows failed');
            }

  # ─── Change detection (selective build/deploy) ─────────────────
  changes:
    name: Detect Changes
    needs: ci-gate
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.eval.outputs.web }}
      admin: ${{ steps.eval.outputs.admin }}
      landing: ${{ steps.eval.outputs.landing }}
      backend: ${{ steps.eval.outputs.backend }}
      any_app: ${{ steps.eval.outputs.any_app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}

      - name: Detect file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/backend/**'
              - 'packages/design-system/**'
              - 'packages/auth/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - 'tsconfig.base.json'
            admin:
              - 'apps/admin/**'
              - 'packages/backend/**'
              - 'packages/design-system/**'
              - 'packages/auth/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - 'tsconfig.base.json'
            landing:
              - 'apps/landing/**'
              - 'packages/design-system/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - 'tsconfig.base.json'
            backend:
              - 'packages/backend/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - 'tsconfig.base.json'

      - name: Evaluate changes
        id: eval
        run: |
          FORCE="${{ inputs.force_deploy || inputs.git_sha != '' }}"

          if [[ "$FORCE" == "true" ]]; then
            echo "Force deploy requested — deploying all apps"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "admin=true" >> "$GITHUB_OUTPUT"
            echo "landing=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "any_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=${{ steps.filter.outputs.web }}" >> "$GITHUB_OUTPUT"
            echo "admin=${{ steps.filter.outputs.admin }}" >> "$GITHUB_OUTPUT"
            echo "landing=${{ steps.filter.outputs.landing }}" >> "$GITHUB_OUTPUT"
            echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"

            if [[ "${{ steps.filter.outputs.web }}" == "true" ]] || \
               [[ "${{ steps.filter.outputs.admin }}" == "true" ]] || \
               [[ "${{ steps.filter.outputs.landing }}" == "true" ]] || \
               [[ "${{ steps.filter.outputs.backend }}" == "true" ]]; then
              echo "any_app=true" >> "$GITHUB_OUTPUT"
            else
              echo "any_app=false" >> "$GITHUB_OUTPUT"
              echo "No app or backend changes detected — skipping build and deploy"
            fi
          fi

  # ─── Build changed apps in parallel ────────────────────────────
  build-web:
    name: Build Web (Staging)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      tarball: ${{ steps.build.outputs.tarball }}
      checksum-file: ${{ steps.build.outputs.checksum-file }}
      input-hash: ${{ steps.build.outputs.input-hash }}
      run-id: ${{ steps.build.outputs.run-id }}
      artifact-id: ${{ steps.build.outputs.artifact-id }}
      built-sha: ${{ steps.build.outputs.built-sha }}
      reused: ${{ steps.build.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}
      - name: Checkout workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ops-workflow
          sparse-checkout: .github
          persist-credentials: false
      - uses: ./.ops-workflow/.github/actions/setup-bun
      - uses: ./.ops-workflow/.github/actions/build-app
        id: build
        with:
          app: web
          environment: production
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_WEB_STAGING }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build-admin:
    name: Build Admin (Staging)
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      tarball: ${{ steps.build.outputs.tarball }}
      checksum-file: ${{ steps.build.outputs.checksum-file }}
      input-hash: ${{ steps.build.outputs.input-hash }}
      run-id: ${{ steps.build.outputs.run-id }}
      artifact-id: ${{ steps.build.outputs.artifact-id }}
      built-sha: ${{ steps.build.outputs.built-sha }}
      reused: ${{ steps.build.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}
      - name: Checkout workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ops-workflow
          sparse-checkout: .github
          persist-credentials: false
      - uses: ./.ops-workflow/.github/actions/setup-bun
      - uses: ./.ops-workflow/.github/actions/build-app
        id: build
        with:
          app: admin
          environment: production
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_ADMIN_STAGING }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build-landing:
    name: Build Landing (Staging)
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      tarball: ${{ steps.build.outputs.tarball }}
      checksum-file: ${{ steps.build.outputs.checksum-file }}
      input-hash: ${{ steps.build.outputs.input-hash }}
      run-id: ${{ steps.build.outputs.run-id }}
      artifact-id: ${{ steps.build.outputs.artifact-id }}
      built-sha: ${{ steps.build.outputs.built-sha }}
      reused: ${{ steps.build.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}
      - name: Checkout workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ops-workflow
          sparse-checkout: .github
          persist-credentials: false
      - uses: ./.ops-workflow/.github/actions/setup-bun
      - uses: ./.ops-workflow/.github/actions/build-app
        id: build
        with:
          app: landing
          environment: production
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_LANDING_STAGING }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ─── Attest build provenance (only for artifacts this run built) ──
  #
  # A reused artifact was attested by the run that produced it; re-attesting the
  # same bytes here would add a second, misleading provenance record.
  attest:
    name: Attest Build Provenance
    needs: [changes, build-web, build-admin, build-landing]
    if: >-
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      (needs.build-web.outputs.reused == 'false' ||
       needs.build-admin.outputs.reused == 'false' ||
       needs.build-landing.outputs.reused == 'false')
    runs-on: ubuntu-latest
    steps:
      - name: Download web artifact
        if: needs.build-web.outputs.reused == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-web.outputs.artifact-name }}
          path: artifacts/web

      - name: Download admin artifact
        if: needs.build-admin.outputs.reused == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-admin.outputs.artifact-name }}
          path: artifacts/admin

      - name: Download landing artifact
        if: needs.build-landing.outputs.reused == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-landing.outputs.artifact-name }}
          path: artifacts/landing

      - name: Attest web artifact
        if: needs.build-web.outputs.reused == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/web/web.tar.gz

      - name: Attest admin artifact
        if: needs.build-admin.outputs.reused == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/admin/admin.tar.gz

      - name: Attest landing artifact
        if: needs.build-landing.outputs.reused == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/landing/landing.tar.gz

  # ─── Deploy Convex backend (if changed) ────────────────────────
  deploy-convex:
    name: Deploy Convex (Staging)
    needs: [changes, build-web, build-admin, build-landing]
    if: >-
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}
      - name: Checkout workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ops-workflow
          sparse-checkout: .github
          persist-credentials: false
      - uses: ./.ops-workflow/.github/actions/setup-bun
      - uses: ./.ops-workflow/.github/actions/deploy-convex
        with:
          deploy-key: ${{ secrets.CONVEX_DEPLOY_KEY }}
          environment: staging

  # ─── Deploy changed apps to Vercel ─────────────────────────────
  deploy-web:
    name: Deploy Web (Staging)
    needs: [changes, build-web, build-admin, build-landing, deploy-convex]
    if: >-
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
      built-sha: ${{ steps.deploy.outputs.built-sha }}
      checksum: ${{ steps.deploy.outputs.checksum }}
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}
      - name: Checkout workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ops-workflow
          sparse-checkout: .github
          persist-credentials: false
      - uses: ./.ops-workflow/.github/actions/setup-bun
      - uses: ./.ops-workflow/.github/actions/deploy-vercel
        id: deploy
        with:
          app: web
          environment: production
          artifact-name: ${{ needs.build-web.outputs.artifact-name }}
          tarball: ${{ needs.build-web.outputs.tarball }}
          checksum-file: ${{ needs.build-web.outputs.checksum-file }}
          run-id: ${{ needs.build-web.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deployed-commit: ${{ inputs.git_sha || github.sha }}
          logical-environment: staging
          request-id: ${{ inputs.request_id }}
          expected-hash: ${{ needs.build-web.outputs.input-hash }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_WEB_STAGING }}

  deploy-admin:
    name: Deploy Admin (Staging)
    needs: [changes, build-web, build-admin, build-landing, deploy-convex]
    if: >-
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
      built-sha: ${{ steps.deploy.outputs.built-sha }}
      checksum: ${{ steps.deploy.outputs.checksum }}
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}
      - name: Checkout workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ops-workflow
          sparse-checkout: .github
          persist-credentials: false
      - uses: ./.ops-workflow/.github/actions/setup-bun
      - uses: ./.ops-workflow/.github/actions/deploy-vercel
        id: deploy
        with:
          app: admin
          environment: production
          artifact-name: ${{ needs.build-admin.outputs.artifact-name }}
          tarball: ${{ needs.build-admin.outputs.tarball }}
          checksum-file: ${{ needs.build-admin.outputs.checksum-file }}
          run-id: ${{ needs.build-admin.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deployed-commit: ${{ inputs.git_sha || github.sha }}
          logical-environment: staging
          request-id: ${{ inputs.request_id }}
          expected-hash: ${{ needs.build-admin.outputs.input-hash }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_ADMIN_STAGING }}

  deploy-landing:
    name: Deploy Landing (Staging)
    needs: [changes, build-web, build-admin, build-landing, deploy-convex]
    if: >-
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
      built-sha: ${{ steps.deploy.outputs.built-sha }}
      checksum: ${{ steps.deploy.outputs.checksum }}
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}
      - name: Checkout workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ops-workflow
          sparse-checkout: .github
          persist-credentials: false
      - uses: ./.ops-workflow/.github/actions/setup-bun
      - uses: ./.ops-workflow/.github/actions/deploy-vercel
        id: deploy
        with:
          app: landing
          environment: production
          artifact-name: ${{ needs.build-landing.outputs.artifact-name }}
          tarball: ${{ needs.build-landing.outputs.tarball }}
          checksum-file: ${{ needs.build-landing.outputs.checksum-file }}
          run-id: ${{ needs.build-landing.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deployed-commit: ${{ inputs.git_sha || github.sha }}
          logical-environment: staging
          request-id: ${{ inputs.request_id }}
          expected-hash: ${{ needs.build-landing.outputs.input-hash }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_LANDING_STAGING }}

  # ─── Smoke tests (only for deployed apps) ──────────────────────
  smoke-test:
    outputs:
      health: ${{ steps.health.outcome }}
    name: Smoke Tests
    needs: [changes, deploy-web, deploy-admin, deploy-landing]
    if: >-
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      (needs.changes.outputs.web == 'true' || needs.changes.outputs.admin == 'true' || needs.changes.outputs.landing == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Health check deployed apps
        id: health
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const apps = [];

            if ('${{ needs.changes.outputs.web }}' === 'true') {
              apps.push({ name: 'web', url: '${{ needs.deploy-web.outputs.deployment-url }}' });
            }
            if ('${{ needs.changes.outputs.admin }}' === 'true') {
              apps.push({ name: 'admin', url: '${{ needs.deploy-admin.outputs.deployment-url }}' });
            }
            if ('${{ needs.changes.outputs.landing }}' === 'true') {
              apps.push({ name: 'landing', url: '${{ needs.deploy-landing.outputs.deployment-url }}' });
            }

            if (apps.length === 0) {
              console.log('No frontend apps deployed — skipping smoke tests');
              return;
            }

            const results = [];
            for (const app of apps) {
              if (!app.url) {
                results.push(`❌ ${app.name}: No deployment URL`);
                continue;
              }
              try {
                const response = await fetch(app.url, {
                  method: 'GET',
                  redirect: 'follow',
                  signal: AbortSignal.timeout(30000),
                });
                if (response.ok) {
                  results.push(`✅ ${app.name}: ${response.status} (${app.url})`);
                } else {
                  results.push(`❌ ${app.name}: ${response.status} (${app.url})`);
                }
              } catch (error) {
                results.push(`❌ ${app.name}: ${error.message}`);
              }
            }

            const summary = results.join('\n');
            console.log(summary);

            core.summary.addHeading('Staging Smoke Tests', 3);
            core.summary.addCodeBlock(summary);
            await core.summary.write();

            const failed = results.filter(r => r.startsWith('❌'));
            if (failed.length > 0) {
              core.setFailed(`${failed.length} smoke test(s) failed`);
            }

  # ─── Record deployment ─────────────────────────────────────────
  record:
    name: Record Staging Deployment
    needs: [changes, smoke-test, deploy-convex, deploy-web, deploy-admin, deploy-landing, attest]
    if: >-
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      needs.changes.outputs.any_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}

      - name: Create deployment tag
        run: |
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config user.name "${{ github.actor }}"

          TIMESTAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          TAG="deploy/staging/${TIMESTAMP}/${OPS_SELECTED_SHA}"
          git tag -a "${TAG}" "${OPS_SELECTED_SHA}" \
            -m "Staging deployment at ${TIMESTAMP}" \
            -m "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin "${TAG}"
          echo "Tagged: ${TAG}" >> "$GITHUB_STEP_SUMMARY"

  ops-record:
    name: Record Ops Outcomes
    if: always()
    needs: [build-web, build-admin, build-landing, deploy-web, deploy-admin, deploy-landing, deploy-convex, changes, smoke-test, record]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github
      - name: Persist app outcomes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OPS_NEEDS: ${{ toJSON(needs) }}
          OPS_ENVIRONMENT: staging
          OPS_SHA: ${{ inputs.git_sha || github.sha }}
          OPS_OPERATION: deploy
          OPS_REQUEST_ID: ${{ inputs.request_id }}
          OPS_HEALTH_JOB: smoke-test
        with:
          script: |
            const record = require('./.github/scripts/record-ops.cjs');
            await record({ github, context, core });
