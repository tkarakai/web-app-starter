name: Deploy Staging

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # ─── Wait for all CI workflows to pass ───────────────────────────
  wait-for-ci:
    name: Wait for CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for ci/gate-passed status
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const maxAttempts = 60;
            const pollInterval = 30000; // 30 seconds

            console.log(`Waiting for ci/gate-passed on ${sha}...`);

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const { data: { statuses } } = await github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref: sha,
              });

              const gate = statuses.find(s => s.context === 'ci/gate-passed');

              if (gate) {
                if (gate.state === 'success') {
                  console.log(`CI gate passed (attempt ${attempt})`);
                  return;
                } else if (gate.state === 'failure' || gate.state === 'error') {
                  core.setFailed(`CI gate failed: ${gate.description}`);
                  return;
                }
              }

              console.log(`Attempt ${attempt}/${maxAttempts}: CI gate not yet set, waiting ${pollInterval/1000}s...`);
              await new Promise(resolve => setTimeout(resolve, pollInterval));
            }

            core.setFailed('Timed out waiting for CI gate');

  # ─── Build all three apps in parallel ────────────────────────────
  build-web:
    name: Build Web (Staging)
    needs: wait-for-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/build-app
        id: build
        with:
          app: web
          environment: preview
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_WEB }}

  build-admin:
    name: Build Admin (Staging)
    needs: wait-for-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/build-app
        id: build
        with:
          app: admin
          environment: preview
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}

  build-landing:
    name: Build Landing (Staging)
    needs: wait-for-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/build-app
        id: build
        with:
          app: landing
          environment: preview
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_LANDING }}

  # ─── Attest build provenance ─────────────────────────────────────
  attest:
    name: Attest Build Provenance
    needs: [build-web, build-admin, build-landing]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attest web artifact
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/web-preview-${{ github.sha }}/web-preview.tar.gz

      - name: Attest admin artifact
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/admin-preview-${{ github.sha }}/admin-preview.tar.gz

      - name: Attest landing artifact
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/landing-preview-${{ github.sha }}/landing-preview.tar.gz

  # ─── Deploy Convex backend (before frontend) ────────────────────
  deploy-convex:
    name: Deploy Convex (Staging)
    needs: [build-web, build-admin, build-landing]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/deploy-convex
        with:
          deploy-key: ${{ secrets.CONVEX_DEPLOY_KEY }}
          environment: staging

  # ─── Deploy all three apps to Vercel ─────────────────────────────
  deploy-web:
    name: Deploy Web (Staging)
    needs: deploy-convex
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/deploy-vercel
        id: deploy
        with:
          app: web
          environment: preview
          artifact-name: web-preview-${{ github.sha }}
          tarball: web-preview.tar.gz
          checksum-file: web-preview.tar.gz.sha256
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_WEB }}

  deploy-admin:
    name: Deploy Admin (Staging)
    needs: deploy-convex
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/deploy-vercel
        id: deploy
        with:
          app: admin
          environment: preview
          artifact-name: admin-preview-${{ github.sha }}
          tarball: admin-preview.tar.gz
          checksum-file: admin-preview.tar.gz.sha256
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}

  deploy-landing:
    name: Deploy Landing (Staging)
    needs: deploy-convex
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/deploy-vercel
        id: deploy
        with:
          app: landing
          environment: preview
          artifact-name: landing-preview-${{ github.sha }}
          tarball: landing-preview.tar.gz
          checksum-file: landing-preview.tar.gz.sha256
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_LANDING }}

  # ─── Smoke tests ─────────────────────────────────────────────────
  smoke-test:
    name: Smoke Tests
    needs: [deploy-web, deploy-admin, deploy-landing]
    runs-on: ubuntu-latest
    steps:
      - name: Health check all staging apps
        uses: actions/github-script@v7
        with:
          script: |
            const apps = [
              { name: 'web', url: '${{ needs.deploy-web.outputs.deployment-url }}' },
              { name: 'admin', url: '${{ needs.deploy-admin.outputs.deployment-url }}' },
              { name: 'landing', url: '${{ needs.deploy-landing.outputs.deployment-url }}' },
            ];

            const results = [];
            for (const app of apps) {
              if (!app.url) {
                results.push(`❌ ${app.name}: No deployment URL`);
                continue;
              }
              try {
                const response = await fetch(app.url, {
                  method: 'GET',
                  redirect: 'follow',
                  signal: AbortSignal.timeout(30000),
                });
                if (response.ok) {
                  results.push(`✅ ${app.name}: ${response.status} (${app.url})`);
                } else {
                  results.push(`⚠️ ${app.name}: ${response.status} (${app.url})`);
                }
              } catch (error) {
                results.push(`❌ ${app.name}: ${error.message}`);
              }
            }

            const summary = results.join('\n');
            console.log(summary);

            core.summary.addHeading('Staging Smoke Tests', 3);
            core.summary.addCodeBlock(summary);
            await core.summary.write();

            const failed = results.filter(r => r.startsWith('❌'));
            if (failed.length > 0) {
              core.setFailed(`${failed.length} smoke test(s) failed`);
            }

  # ─── Record deployment ───────────────────────────────────────────
  record:
    name: Record Staging Deployment
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create deployment tag
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          TAG="deploy/staging/${TIMESTAMP}/${{ github.sha }}"
          git tag "${TAG}" "${{ github.sha }}"
          git push origin "${TAG}"
          echo "Tagged: ${TAG}" >> "$GITHUB_STEP_SUMMARY"
