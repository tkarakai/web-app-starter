name: CI Landing Static

# App-owned caller. The checks live in the platform's reusable workflow
# (platform-ci-landing-static.yml, replaced on platform upgrade); edit the triggers here.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, v2]

permissions:
  contents: read
  pull-requests: read

jobs:
  platform:
    name: Platform
    uses: ./.github/workflows/platform-ci-landing-static.yml

  # The required status check (branch rules name it).
  complete:
    name: CI Landing Static Complete
    needs: [platform]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the platform workflow to pass
        run: |
          echo "Platform CI Landing Static: ${{ needs.platform.result }}"
          [[ "${{ needs.platform.result }}" == "success" ]]
