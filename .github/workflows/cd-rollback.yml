name: Rollback Deployment

run-name: "Rollback ${{ inputs.target_sha }} [ops:${{ inputs.request_id || github.run_id }}]"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation ID supplied by the ops CLI
        type: string
        required: false
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
      target_sha:
        description: "Git SHA to rollback to (must have been previously deployed)"
        required: true
        type: string
      confirm:
        description: "Type 'rollback-staging' or 'rollback-production' to confirm"
        required: true
        type: string

env:
  OPS_SELECTED_SHA: ${{ inputs.target_sha }}

permissions:
  contents: write
  actions: read
  deployments: write
  id-token: write
  attestations: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # ─── Validate inputs ─────────────────────────────────────────────
  validate:
    name: Validate Rollback
    runs-on: ubuntu-latest
    outputs:
      vercel-env: ${{ steps.env.outputs.vercel-env }}
      project-id-web: ${{ steps.projects.outputs.web }}
      project-id-admin: ${{ steps.projects.outputs.admin }}
      project-id-landing: ${{ steps.projects.outputs.landing }}
    steps:
      - name: Verify confirmation string
        if: inputs.confirm != format('rollback-{0}', inputs.environment)
        run: |
          echo "::error::Confirmation failed. Type 'rollback-${{ inputs.environment }}' to confirm."
          exit 1

      - name: Verify previous deployment exists
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const sha = process.env.OPS_SELECTED_SHA;
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error("A full 40-character target SHA is required.");
            const env = '${{ inputs.environment }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // For production rollback, check production tags
            // For staging rollback, check staging tags
            const tagPrefix = `tags/deploy/${env}/`;

            try {
              const tags = await github.paginate(github.rest.git.listMatchingRefs, {
                owner,
                repo,
                ref: tagPrefix,
              });

              const found = tags.find(tag => tag.ref.endsWith(`/${sha}`));
              // A tag's name is only a claim: resolve annotated tags to the commit.
              if (found) {
                let object = found.object;
                for (let depth = 0; object?.type === 'tag' && depth < 5; depth++) {
                  const detail = await github.rest.git.getTag({ owner, repo, tag_sha: object.sha });
                  object = detail.data.object;
                }
                if (object?.type !== 'commit' || object.sha !== sha) {
                  throw new Error('Deployment tag target does not match its SHA suffix.');
                }
              }
              if (!found) {
                core.setFailed(`No ${env} deployment tag found for SHA ${sha}.`);
              } else {
                console.log(`Found deployment tag: ${found.ref}`);
              }
            } catch (error) {
              core.setFailed(`Could not verify deployment tag: ${error.message}`);
            }

      - name: Set Vercel environment
        id: env
        run: |
          echo "vercel-env=production" >> "$GITHUB_OUTPUT"

      - name: Resolve Vercel project IDs
        id: projects
        run: |
          if [ "${{ inputs.environment }}" = "staging" ]; then
            web="${{ secrets.VERCEL_PROJECT_ID_WEB_STAGING }}"
            admin="${{ secrets.VERCEL_PROJECT_ID_ADMIN_STAGING }}"
            landing="${{ secrets.VERCEL_PROJECT_ID_LANDING_STAGING }}"
          else
            web="${{ secrets.VERCEL_PROJECT_ID_WEB }}"
            admin="${{ secrets.VERCEL_PROJECT_ID_ADMIN }}"
            landing="${{ secrets.VERCEL_PROJECT_ID_LANDING }}"
          fi

          for name in web admin landing; do
            val=$(eval echo \$$name)
            if [ -z "$val" ]; then
              echo "::error::Missing Vercel project ID for $name in ${{ inputs.environment }} environment"
              exit 1
            fi
          done

          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "admin=$admin" >> "$GITHUB_OUTPUT"
          echo "landing=$landing" >> "$GITHUB_OUTPUT"

  # ─── Rebuild and redeploy ────────────────────────────────────────
  build-web:
    name: Resolve Web Artifact (Rollback)
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      tarball: ${{ steps.build.outputs.tarball }}
      checksum-file: ${{ steps.build.outputs.checksum-file }}
      input-hash: ${{ steps.build.outputs.input-hash }}
      run-id: ${{ steps.build.outputs.run-id }}
      reused: ${{ steps.build.outputs.reused }}
      artifact-id: ${{ steps.build.outputs.artifact-id }}
      built-sha: ${{ steps.build.outputs.built-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
      - name: Checkout workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ops-workflow
          sparse-checkout: .github
          persist-credentials: false
      - uses: ./.ops-workflow/.github/actions/setup-bun
      - uses: ./.ops-workflow/.github/actions/build-app
        id: build
        with:
          app: web
          environment: ${{ needs.validate.outputs.vercel-env }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ needs.validate.outputs.project-id-web }}

  build-admin:
    name: Resolve Admin Artifact (Rollback)
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      tarball: ${{ steps.build.outputs.tarball }}
      checksum-file: ${{ steps.build.outputs.checksum-file }}
      input-hash: ${{ steps.build.outputs.input-hash }}
      run-id: ${{ steps.build.outputs.run-id }}
      reused: ${{ steps.build.outputs.reused }}
      artifact-id: ${{ steps.build.outputs.artifact-id }}
      built-sha: ${{ steps.build.outputs.built-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
      - name: Checkout workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ops-workflow
          sparse-checkout: .github
          persist-credentials: false
      - uses: ./.ops-workflow/.github/actions/setup-bun
      - uses: ./.ops-workflow/.github/actions/build-app
        id: build
        with:
          app: admin
          environment: ${{ needs.validate.outputs.vercel-env }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ needs.validate.outputs.project-id-admin }}

  build-landing:
    name: Resolve Landing Artifact (Rollback)
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      tarball: ${{ steps.build.outputs.tarball }}
      checksum-file: ${{ steps.build.outputs.checksum-file }}
      input-hash: ${{ steps.build.outputs.input-hash }}
      run-id: ${{ steps.build.outputs.run-id }}
      reused: ${{ steps.build.outputs.reused }}
      artifact-id: ${{ steps.build.outputs.artifact-id }}
      built-sha: ${{ steps.build.outputs.built-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
      - name: Checkout workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ops-workflow
          sparse-checkout: .github
          persist-credentials: false
      - uses: ./.ops-workflow/.github/actions/setup-bun
      - uses: ./.ops-workflow/.github/actions/build-app
        id: build
        with:
          app: landing
          environment: ${{ needs.validate.outputs.vercel-env }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ needs.validate.outputs.project-id-landing }}

  # ─── Deploy Convex (rollback functions) ──────────────────────────
  deploy-convex:
    name: Deploy Convex (Rollback)
    needs: [build-web, build-admin, build-landing]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
      - name: Checkout workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ops-workflow
          sparse-checkout: .github
          persist-credentials: false
      - uses: ./.ops-workflow/.github/actions/setup-bun
      - uses: ./.ops-workflow/.github/actions/deploy-convex
        with:
          deploy-key: ${{ secrets.CONVEX_DEPLOY_KEY }}
          environment: ${{ inputs.environment }}

  # ─── Deploy apps ─────────────────────────────────────────────────
  deploy-web:
    name: Deploy Web (Rollback)
    needs: [validate, build-web, deploy-convex]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
      built-sha: ${{ steps.deploy.outputs.built-sha }}
      checksum: ${{ steps.deploy.outputs.checksum }}
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
      - name: Checkout workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ops-workflow
          sparse-checkout: .github
          persist-credentials: false
      - uses: ./.ops-workflow/.github/actions/setup-bun
      - uses: ./.ops-workflow/.github/actions/deploy-vercel
        id: deploy
        with:
          app: web
          environment: ${{ needs.validate.outputs.vercel-env }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-name: ${{ needs.build-web.outputs.artifact-name }}
          tarball: ${{ needs.build-web.outputs.tarball }}
          checksum-file: ${{ needs.build-web.outputs.checksum-file }}
          run-id: ${{ needs.build-web.outputs.run-id }}
          deployed-commit: ${{ inputs.target_sha }}
          logical-environment: ${{ inputs.environment }}
          request-id: ${{ inputs.request_id }}
          expected-hash: ${{ needs.build-web.outputs.input-hash }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ needs.validate.outputs.project-id-web }}

  deploy-admin:
    name: Deploy Admin (Rollback)
    needs: [validate, build-admin, deploy-convex]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
      built-sha: ${{ steps.deploy.outputs.built-sha }}
      checksum: ${{ steps.deploy.outputs.checksum }}
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
      - name: Checkout workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ops-workflow
          sparse-checkout: .github
          persist-credentials: false
      - uses: ./.ops-workflow/.github/actions/setup-bun
      - uses: ./.ops-workflow/.github/actions/deploy-vercel
        id: deploy
        with:
          app: admin
          environment: ${{ needs.validate.outputs.vercel-env }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-name: ${{ needs.build-admin.outputs.artifact-name }}
          tarball: ${{ needs.build-admin.outputs.tarball }}
          checksum-file: ${{ needs.build-admin.outputs.checksum-file }}
          run-id: ${{ needs.build-admin.outputs.run-id }}
          deployed-commit: ${{ inputs.target_sha }}
          logical-environment: ${{ inputs.environment }}
          request-id: ${{ inputs.request_id }}
          expected-hash: ${{ needs.build-admin.outputs.input-hash }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ needs.validate.outputs.project-id-admin }}

  deploy-landing:
    name: Deploy Landing (Rollback)
    needs: [validate, build-landing, deploy-convex]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
      built-sha: ${{ steps.deploy.outputs.built-sha }}
      checksum: ${{ steps.deploy.outputs.checksum }}
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
      - name: Checkout workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ops-workflow
          sparse-checkout: .github
          persist-credentials: false
      - uses: ./.ops-workflow/.github/actions/setup-bun
      - uses: ./.ops-workflow/.github/actions/deploy-vercel
        id: deploy
        with:
          app: landing
          environment: ${{ needs.validate.outputs.vercel-env }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-name: ${{ needs.build-landing.outputs.artifact-name }}
          tarball: ${{ needs.build-landing.outputs.tarball }}
          checksum-file: ${{ needs.build-landing.outputs.checksum-file }}
          run-id: ${{ needs.build-landing.outputs.run-id }}
          deployed-commit: ${{ inputs.target_sha }}
          logical-environment: ${{ inputs.environment }}
          request-id: ${{ inputs.request_id }}
          expected-hash: ${{ needs.build-landing.outputs.input-hash }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ needs.validate.outputs.project-id-landing }}

  # ─── Post-rollback ───────────────────────────────────────────────
  post-rollback:
    outputs:
      health: ${{ steps.health.outcome }}
    name: Post-Rollback Verification
    needs: [deploy-web, deploy-admin, deploy-landing]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}

      - name: Health check all apps
        id: health
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const apps = [
              { name: 'web', url: '${{ needs.deploy-web.outputs.deployment-url }}' },
              { name: 'admin', url: '${{ needs.deploy-admin.outputs.deployment-url }}' },
              { name: 'landing', url: '${{ needs.deploy-landing.outputs.deployment-url }}' },
            ];

            const results = [];
            for (const app of apps) {
              if (!app.url) {
                results.push(`❌ ${app.name}: No deployment URL`);
                continue;
              }
              try {
                const response = await fetch(app.url, {
                  method: 'GET',
                  redirect: 'follow',
                  signal: AbortSignal.timeout(30000),
                });
                if (response.ok) {
                  results.push(`✅ ${app.name}: ${response.status} (${app.url})`);
                } else {
                  results.push(`❌ ${app.name}: ${response.status} (${app.url})`);
                }
              } catch (error) {
                results.push(`❌ ${app.name}: ${error.message}`);
              }
            }

            const summary = results.join('\n');
            console.log(summary);

            core.summary.addHeading('Rollback Health Checks', 3);
            core.summary.addCodeBlock(summary);
            await core.summary.write();
            const failed = results.filter(r => r.startsWith('❌'));
            if (failed.length) core.setFailed(`${failed.length} rollback health check(s) failed`);

      - name: Create rollback tag
        run: |
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config user.name "${{ github.actor }}"

          TIMESTAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          TAG="deploy/${{ inputs.environment }}/rollback/${TIMESTAMP}/${OPS_SELECTED_SHA}"
          git tag -a "${TAG}" "${OPS_SELECTED_SHA}" \
            -m "Rollback ${{ inputs.environment }} to ${OPS_SELECTED_SHA}" \
            -m "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin "${TAG}"

          echo "### Rollback Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment:** ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Rolled back to:** ${OPS_SELECTED_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** ${TAG}" >> "$GITHUB_STEP_SUMMARY"

  ops-record:
    name: Record Ops Outcomes
    if: always()
    needs: [build-web, build-admin, build-landing, deploy-web, deploy-admin, deploy-landing, deploy-convex, validate, post-rollback]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github
      - name: Persist app outcomes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OPS_NEEDS: ${{ toJSON(needs) }}
          OPS_ENVIRONMENT: ${{ inputs.environment }}
          OPS_SHA: ${{ inputs.target_sha }}
          OPS_OPERATION: rollback
          OPS_REQUEST_ID: ${{ inputs.request_id }}
          OPS_HEALTH_JOB: post-rollback
        with:
          script: |
            const record = require('./.github/scripts/record-ops.cjs');
            await record({ github, context, core });
