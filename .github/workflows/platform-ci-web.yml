name: Platform CI Web

on:
  workflow_call:
    inputs:
      require_e2e:
        description: Require every E2E job for full commit verification
        type: boolean
        default: false
      git_sha:
        description: Source commit to test
        type: string
        required: false
        default: ""

concurrency:
  group: ci-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  # ============================================================
  # CHANGE DETECTION
  # ============================================================
  changes:
    name: Detect Changes
    runs-on: ${{ fromJSON(startsWith(github.workflow, 'CI ') && vars.PLATFORM_CI_WORKER_POOL != '' && format('["self-hosted","{0}","starter-source-{1}","starter-run-{2}"]', vars.PLATFORM_CI_WORKER_POOL, inputs.git_sha || github.sha, github.run_id) || format('["{0}"]', vars.PLATFORM_CI_RUNNER || 'ubuntu-latest')) }}
    outputs:
      should_run: ${{ inputs.git_sha != '' && 'true' || steps.act-all.outputs.should_run || steps.evaluate.outputs.should_run }}
      e2e: ${{ steps.act-all.outputs.e2e || steps.e2e.outputs.e2e }}
    steps:
      - name: Run all jobs in act
        if: ${{ env.ACT }}
        id: act-all
        run: |
          echo "Running in act — skipping change detection"
          {
            echo "should_run=true"
            echo "e2e=run"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: ${{ !env.ACT }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}

      - name: Resolve E2E policy
        if: ${{ !env.ACT }}
        id: e2e
        env:
          PR_E2E: ${{ vars.PLATFORM_CI_PR_E2E }}
          REQUIRE_E2E: ${{ inputs.require_e2e }}
          EVENT_NAME: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          # Only web passes this: one cost notice per push on a private repository without a mode.
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: ./platform/tooling/ci-e2e-policy.sh resolve

      - name: Detect file changes
        if: ${{ !env.ACT }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/platform-impact.json

      - name: Evaluate changes
        if: ${{ !env.ACT }}
        id: evaluate
        run: |
          if [[ "${{ steps.filter.outputs.web }}" == "true" || "${{ steps.filter.outputs.root }}" == "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping web — no relevant changes"
          fi

  # ============================================================
  # UNIT & COMPONENT TESTS
  # ============================================================
  test:
    name: Test
    runs-on: ${{ fromJSON(startsWith(github.workflow, 'CI ') && vars.PLATFORM_CI_WORKER_POOL != '' && format('["self-hosted","{0}","starter-source-{1}","starter-run-{2}"]', vars.PLATFORM_CI_WORKER_POOL, inputs.git_sha || github.sha, github.run_id) || format('["{0}"]', vars.PLATFORM_CI_RUNNER || 'ubuntu-latest')) }}
    needs: [changes]
    if: needs.changes.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}
      - uses: ./.github/actions/setup-bun

      - name: Run Bun tests
        run: cd apps/web && bun run test

      - name: Run Vitest with coverage
        run: cd apps/web && bun run test:coverage

      - name: Display coverage summary
        if: always()
        run: |
          JOB_DIR="/act-artifacts/web/test"
          if [ -n "$ACT" ]; then
            mkdir -p "$JOB_DIR"
            SUMMARY_FILE="$JOB_DIR/step-summary.md"
          else
            SUMMARY_FILE="$GITHUB_STEP_SUMMARY"
          fi
          COVERAGE_FILE="apps/web/qa/coverage/coverage-summary.json"
          if [ -f "$COVERAGE_FILE" ]; then
            {
              echo "## Coverage Summary (web)"
              echo ""
              echo "| Metric | Coverage |"
              echo "|--------|----------|"
              echo "| Lines | $(jq -r '.total.lines.pct' "$COVERAGE_FILE")% |"
              echo "| Branches | $(jq -r '.total.branches.pct' "$COVERAGE_FILE")% |"
              echo "| Functions | $(jq -r '.total.functions.pct' "$COVERAGE_FILE")% |"
              echo "| Statements | $(jq -r '.total.statements.pct' "$COVERAGE_FILE")% |"
            } >> "$SUMMARY_FILE"
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && !env.ACT }}
        continue-on-error: true
        with:
          name: coverage-report-web
          path: apps/web/qa/coverage/
          retention-days: ${{ vars.PLATFORM_CI_ARTIFACT_RETENTION_DAYS || 7 }}

      - name: Save job outputs (act)
        if: ${{ always() && env.ACT }}
        run: |
          JOB_DIR="/act-artifacts/web/test"
          mkdir -p "$JOB_DIR/artifacts"
          [ -d "apps/web/qa/coverage" ] && cp -r "apps/web/qa/coverage" "$JOB_DIR/artifacts/coverage-web" 2>/dev/null || true

  # ============================================================
  # BUILD & BUNDLE SIZE
  # ============================================================
  build:
    name: Build & Bundle Size
    runs-on: ${{ fromJSON(startsWith(github.workflow, 'CI ') && vars.PLATFORM_CI_WORKER_POOL != '' && format('["self-hosted","{0}","starter-source-{1}","starter-run-{2}"]', vars.PLATFORM_CI_WORKER_POOL, inputs.git_sha || github.sha, github.run_id) || format('["{0}"]', vars.PLATFORM_CI_RUNNER || 'ubuntu-latest')) }}
    needs: [changes]
    if: needs.changes.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}
      - uses: ./.github/actions/setup-bun

      - name: Build
        run: bunx turbo build --filter=@repo/web...
        env:
          CONVEX_URL: "https://placeholder.convex.cloud"
          CONVEX_SITE_URL: "https://placeholder.convex.site"
          APP_ORIGIN: ${{ env.APP_CONFIG_ORIGIN_WEB }}
          LANDING_URL: ${{ env.APP_CONFIG_ORIGIN_LANDING }}

      - name: Check bundle size
        run: cd apps/web && bun run size

  # ============================================================
  # E2E ON DEMAND (PLATFORM_CI_PR_E2E=on-demand)
  # ============================================================
  # Fails a ready PR without the run-e2e label, so `CI <App> Complete` can't pass
  # until E2E has run on the head. Adding the label re-runs this job and E2E
  # (platform-ci-e2e-request.yml).
  e2e-required:
    name: E2E Required
    runs-on: ${{ fromJSON(startsWith(github.workflow, 'CI ') && vars.PLATFORM_CI_WORKER_POOL != '' && format('["self-hosted","{0}","starter-source-{1}","starter-run-{2}"]', vars.PLATFORM_CI_WORKER_POOL, inputs.git_sha || github.sha, github.run_id) || format('["{0}"]', vars.PLATFORM_CI_RUNNER || 'ubuntu-latest')) }}
    needs: [changes]
    if: needs.changes.outputs.should_run == 'true' && needs.changes.outputs.e2e == 'on-demand'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}
          sparse-checkout: platform/tooling/ci-e2e-policy.sh
          sparse-checkout-cone-mode: false

      - name: Check for the run-e2e label
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ./platform/tooling/ci-e2e-policy.sh label

  # ============================================================
  # E2E TESTS
  # ============================================================
  e2e:
    name: E2E Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ${{ fromJSON(startsWith(github.workflow, 'CI ') && vars.PLATFORM_CI_WORKER_POOL != '' && format('["self-hosted","{0}","starter-source-{1}","starter-run-{2}"]', vars.PLATFORM_CI_WORKER_POOL, inputs.git_sha || github.sha, github.run_id) || format('["{0}"]', vars.PLATFORM_CI_RUNNER || 'ubuntu-latest')) }}
    needs: [changes, build, e2e-required]
    # `!cancelled()` lets E2E run when e2e-required was skipped (mode always or a forced run).
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.changes.outputs.e2e == 'run' || needs.e2e-required.result == 'success') }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-playwright
        with:
          working-directory: apps/web

      # `convex dev` in anonymous mode downloads its local backend binary from
      # GitHub releases UNAUTHENTICATED. Four shards booting at once hit
      # "403 API rate limit exceeded" and the webServer never starts. Cache the
      # binary so at most the first run downloads it. Self-hosted runners keep
      # it in a persistent folder instead (platform/docs/ci-pre-push.md).
      - name: Cache Convex local backend
        if: ${{ env.ACT || runner.environment != 'self-hosted' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.convex
          key: ${{ runner.os }}-${{ runner.arch }}-convex-backend-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-convex-backend-

      # Playwright's --shard splits by test count, so the slow serial auth suites
      # pile into one shard while the others idle. Plan whole spec files by their
      # recorded durations instead (apps/web/qa/e2e/shard-durations.json; new
      # files are estimated). Every shard computes the same plan from the commit.
      - name: Plan this shard
        run: |
          (cd apps/web && CI=true ./node_modules/.bin/playwright test --list --reporter=json --project=chromium) > "$RUNNER_TEMP/e2e-list.json"
          ./platform/tooling/node-ts.sh platform/tooling/e2e-shard-plan.ts plan \
            --list "$RUNNER_TEMP/e2e-list.json" \
            --durations apps/web/qa/e2e/shard-durations.json \
            --shard ${{ matrix.shard }}/${{ strategy.job-total }} \
            --out "$RUNNER_TEMP/e2e-shard.txt"

      # Each shard boots its own Convex backend via the Playwright webServer,
      # so auth rate-limit counters stay per-shard and workers stay at 1.
      - name: Run Playwright tests
        run: |
          # Stagger the shards: if the cache missed, this keeps four concurrent
          # Convex backend downloads from hitting GitHub's unauthenticated limit
          # at the same instant.
          sleep $(( (${{ matrix.shard }} - 1) * 20 ))
          cd apps/web && bunx playwright test --project=chromium --test-list "$RUNNER_TEMP/e2e-shard.txt" --pass-with-no-tests
        env:
          CI: true

      - name: Show dev logs on failure
        if: failure()
        run: |
          echo "=== Convex Dev Log ==="
          cat .convex-dev.log 2>/dev/null || echo "No Convex log found"
          echo ""
          echo "=== Next.js Dev Log (web) ==="
          cat .next-web.log 2>/dev/null || echo "No Next.js log found"

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() && !env.ACT }}
        continue-on-error: true
        with:
          name: blob-report-web-${{ matrix.shard }}
          path: apps/web/blob-report/
          retention-days: ${{ vars.PLATFORM_CI_ARTIFACT_RETENTION_DAYS || 7 }}

      - name: Upload visual snapshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() && !env.ACT }}
        continue-on-error: true
        with:
          name: visual-snapshots-web-${{ matrix.shard }}
          path: apps/web/qa/e2e/__screenshots__/
          retention-days: ${{ vars.PLATFORM_CI_ARTIFACT_RETENTION_DAYS || 7 }}
          if-no-files-found: ignore

      - name: Save job outputs (act)
        if: ${{ always() && env.ACT }}
        run: |
          JOB_DIR="/act-artifacts/web/e2e/shard-${{ matrix.shard }}"
          mkdir -p "$JOB_DIR/artifacts"
          [ -d "apps/web/qa/playwright-report" ] && cp -r "apps/web/qa/playwright-report" "$JOB_DIR/artifacts/playwright-report-web" 2>/dev/null || true
          [ -d "apps/web/qa/e2e/__screenshots__" ] && cp -r "apps/web/qa/e2e/__screenshots__" "$JOB_DIR/artifacts/visual-snapshots-web" 2>/dev/null || true

  # ============================================================
  # MERGE SHARDED E2E REPORTS
  # ============================================================
  e2e-report:
    name: Merge E2E Reports
    runs-on: ${{ fromJSON(startsWith(github.workflow, 'CI ') && vars.PLATFORM_CI_WORKER_POOL != '' && format('["self-hosted","{0}","starter-source-{1}","starter-run-{2}"]', vars.PLATFORM_CI_WORKER_POOL, inputs.git_sha || github.sha, github.run_id) || format('["{0}"]', vars.PLATFORM_CI_RUNNER || 'ubuntu-latest')) }}
    needs: [changes, e2e]
    # Only a failed run needs the report: shards upload their blob reports on
    # failure, and a green run would merge nothing (and spend a billed job).
    # NOTE: the `env` context is not available in a job-level `if` — using it
    # here makes GitHub reject the entire workflow file at parse time.
    if: ${{ always() && needs.e2e.result == 'failure' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}
      - uses: ./.github/actions/setup-bun

      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: apps/web/all-blob-reports
          pattern: blob-report-web-*
          merge-multiple: true

      - name: Merge into HTML report
        run: cd apps/web && bunx playwright merge-reports --reporter=html ./all-blob-reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: qa/playwright-report

      - name: Upload merged report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: playwright-report-web
          path: apps/web/qa/playwright-report/
          retention-days: ${{ vars.PLATFORM_CI_ARTIFACT_RETENTION_DAYS || 7 }}
