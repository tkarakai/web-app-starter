name: Platform CI Landing

on:
  workflow_call:
    inputs:
      require_e2e:
        description: Require every E2E job for full commit verification
        type: boolean
        default: false
      git_sha:
        description: Source commit to test
        type: string
        required: false
        default: ""

concurrency:
  group: ci-landing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  # ============================================================
  # CHANGE DETECTION
  # ============================================================
  changes:
    name: Detect Changes
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    outputs:
      should_run: ${{ steps.present.outputs.app == 'true' && (inputs.git_sha != '' && 'true' || steps.act-all.outputs.should_run || steps.evaluate.outputs.should_run) || 'false' }}
      e2e: ${{ steps.act-all.outputs.e2e || steps.e2e.outputs.e2e }}
    steps:
      - name: Run all jobs in act
        if: ${{ env.ACT }}
        id: act-all
        run: |
          echo "Running in act — skipping change detection"
          echo "should_run=true" >> $GITHUB_OUTPUT
          echo "e2e=run" >> $GITHUB_OUTPUT

      - name: Checkout
        if: ${{ !env.ACT }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}

      - name: Check optional app
        id: present
        run: |
          if [ -f apps/landing/package.json ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "::notice::landing is not installed; skipping its CI."
          fi

      - name: Resolve E2E policy
        if: ${{ !env.ACT }}
        id: e2e
        env:
          PR_E2E: ${{ vars.PLATFORM_CI_PR_E2E }}
          REQUIRE_E2E: ${{ inputs.require_e2e }}
          EVENT_NAME: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: ./platform/tooling/ci-e2e-policy.sh resolve

      - name: Detect file changes
        if: ${{ !env.ACT }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/platform-impact.json

      - name: Evaluate changes
        if: ${{ !env.ACT }}
        id: evaluate
        run: |
          if [[ "${{ steps.filter.outputs.landing }}" == "true" || "${{ steps.filter.outputs.root }}" == "true" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "Skipping landing — no relevant changes"
          fi

  # ============================================================
  # UNIT & COMPONENT TESTS
  # ============================================================
  test:
    name: Test
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    needs: [changes]
    if: needs.changes.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}
      - uses: ./.github/actions/setup-bun

      - name: Run Bun tests
        run: cd apps/landing && bun run test

      - name: Run Vitest with coverage
        run: cd apps/landing && bun run test:coverage

      - name: Display coverage summary
        if: always()
        run: |
          JOB_DIR="/act-artifacts/landing/test"
          if [ -n "$ACT" ]; then
            mkdir -p "$JOB_DIR"
            SUMMARY_FILE="$JOB_DIR/step-summary.md"
          else
            SUMMARY_FILE="$GITHUB_STEP_SUMMARY"
          fi
          COVERAGE_FILE="apps/landing/qa/coverage/coverage-summary.json"
          if [ -f "$COVERAGE_FILE" ]; then
            echo "## Coverage Summary (landing)" >> "$SUMMARY_FILE"
            echo "" >> "$SUMMARY_FILE"
            echo "| Metric | Coverage |" >> "$SUMMARY_FILE"
            echo "|--------|----------|" >> "$SUMMARY_FILE"
            echo "| Lines | $(jq -r '.total.lines.pct' "$COVERAGE_FILE")% |" >> "$SUMMARY_FILE"
            echo "| Branches | $(jq -r '.total.branches.pct' "$COVERAGE_FILE")% |" >> "$SUMMARY_FILE"
            echo "| Functions | $(jq -r '.total.functions.pct' "$COVERAGE_FILE")% |" >> "$SUMMARY_FILE"
            echo "| Statements | $(jq -r '.total.statements.pct' "$COVERAGE_FILE")% |" >> "$SUMMARY_FILE"
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && !env.ACT }}
        continue-on-error: true
        with:
          name: coverage-report-landing
          path: apps/landing/qa/coverage/
          retention-days: ${{ vars.PLATFORM_CI_ARTIFACT_RETENTION_DAYS || 7 }}

      - name: Save job outputs (act)
        if: ${{ always() && env.ACT }}
        run: |
          JOB_DIR="/act-artifacts/landing/test"
          mkdir -p "$JOB_DIR/artifacts"
          [ -d "apps/landing/qa/coverage" ] && cp -r "apps/landing/qa/coverage" "$JOB_DIR/artifacts/coverage-landing" 2>/dev/null || true

  # ============================================================
  # BUILD & BUNDLE SIZE
  # ============================================================
  build:
    name: Build & Bundle Size
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    needs: [changes]
    if: needs.changes.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}
      - uses: ./.github/actions/setup-bun

      - uses: ./.github/actions/setup-playwright
        with:
          working-directory: apps/landing

      - name: Build and smoke both production configuration variants
        run: bun run test:landing-artifacts

      - name: Check bundle size
        run: cd apps/landing && bun run size

  # ============================================================
  # E2E ON DEMAND (PLATFORM_CI_PR_E2E=on-demand)
  # ============================================================
  # Fails a ready PR without the run-e2e label, so `CI <App> Complete` can't pass
  # until E2E has run on the head. Adding the label re-runs this job and E2E
  # (platform-ci-e2e-request.yml).
  e2e-required:
    name: E2E Required
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    needs: [changes]
    if: needs.changes.outputs.should_run == 'true' && needs.changes.outputs.e2e == 'on-demand'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}
          sparse-checkout: platform/tooling/ci-e2e-policy.sh
          sparse-checkout-cone-mode: false

      - name: Check for the run-e2e label
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ./platform/tooling/ci-e2e-policy.sh label

  # ============================================================
  # E2E TESTS
  # ============================================================
  e2e:
    name: E2E Tests
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    needs: [changes, build, e2e-required]
    # `!cancelled()` lets E2E run when e2e-required was skipped (mode always or a forced run).
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.changes.outputs.e2e == 'run' || needs.e2e-required.result == 'success') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-playwright
        with:
          working-directory: apps/landing

      - name: Run Playwright tests
        run: cd apps/landing && bunx playwright test --project=chromium
        env:
          CI: true

      - name: Show dev logs on failure
        if: failure()
        run: |
          echo "=== Next.js Dev Log (landing) ==="
          cat .next-landing.log 2>/dev/null || echo "No Next.js log found"

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() && !env.ACT }}
        continue-on-error: true
        with:
          name: playwright-report-landing
          path: apps/landing/qa/playwright-report/
          retention-days: ${{ vars.PLATFORM_CI_ARTIFACT_RETENTION_DAYS || 7 }}

      - name: Upload visual snapshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() && !env.ACT }}
        continue-on-error: true
        with:
          name: visual-snapshots-landing
          path: apps/landing/qa/e2e/__screenshots__/
          retention-days: ${{ vars.PLATFORM_CI_ARTIFACT_RETENTION_DAYS || 7 }}
          if-no-files-found: ignore

      - name: Save job outputs (act)
        if: ${{ always() && env.ACT }}
        run: |
          JOB_DIR="/act-artifacts/landing/e2e"
          mkdir -p "$JOB_DIR/artifacts"
          [ -d "apps/landing/qa/playwright-report" ] && cp -r "apps/landing/qa/playwright-report" "$JOB_DIR/artifacts/playwright-report-landing" 2>/dev/null || true
          [ -d "apps/landing/qa/e2e/__screenshots__" ] && cp -r "apps/landing/qa/e2e/__screenshots__" "$JOB_DIR/artifacts/visual-snapshots-landing" 2>/dev/null || true
