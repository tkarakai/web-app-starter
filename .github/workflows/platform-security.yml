name: Platform Security

on:
  workflow_call:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # Paid features: CodeQL and dependency review are free on public repositories and need
  # GitHub Code Security on private ones. They run when the repository is public or the
  # repository variable PLATFORM_CODE_SECURITY is "true" (platform/docs/ci-github.md), and are
  # otherwise skipped with a visible notice, so the workflow works on GitHub Free.
  paid-features:
    name: Paid Features
    runs-on: ${{ fromJSON(vars.PLATFORM_CI_WORKER_POOL != '' && github.event_name != 'schedule' && format('["self-hosted","{0}","starter-source-{1}","starter-run-{2}"]', vars.PLATFORM_CI_WORKER_POOL, github.sha, github.run_id) || format('["{0}"]', vars.PLATFORM_CI_AUX_RUNNER || vars.PLATFORM_CI_RUNNER || ((vars.PLATFORM_CI_LOCAL_ONLY == 'true' || vars.PLATFORM_CI_WORKER_POOL != '' || vars.PLATFORM_CI_AUX_RUNNER != '' || vars.PLATFORM_CI_RUNNER != '' || vars.PLATFORM_UPDATE_RUNNER != '' || vars.PLATFORM_UPDATE_DELIVERY_RUNNER != '') && 'starter-local-only-unconfigured' || 'ubuntu-latest'))) }}
    outputs:
      code_security: ${{ steps.gate.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
      - id: gate
        uses: ./.github/actions/paid-feature
        with:
          feature: CodeQL and dependency review
          enabled: ${{ vars.PLATFORM_CODE_SECURITY }}
          variable: PLATFORM_CODE_SECURITY

  codeql:
    name: CodeQL Analysis
    needs: paid-features
    if: needs.paid-features.outputs.code_security == 'true'
    runs-on: ${{ fromJSON(vars.PLATFORM_CI_WORKER_POOL != '' && github.event_name != 'schedule' && format('["self-hosted","{0}","starter-source-{1}","starter-run-{2}"]', vars.PLATFORM_CI_WORKER_POOL, github.sha, github.run_id) || format('["{0}"]', vars.PLATFORM_CI_AUX_RUNNER || vars.PLATFORM_CI_RUNNER || ((vars.PLATFORM_CI_LOCAL_ONLY == 'true' || vars.PLATFORM_CI_WORKER_POOL != '' || vars.PLATFORM_CI_AUX_RUNNER != '' || vars.PLATFORM_CI_RUNNER != '' || vars.PLATFORM_UPDATE_RUNNER != '' || vars.PLATFORM_UPDATE_DELIVERY_RUNNER != '') && 'starter-local-only-unconfigured' || 'ubuntu-latest'))) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:javascript-typescript"

  dependency-audit:
    name: Dependency Audit
    runs-on: ${{ fromJSON(vars.PLATFORM_CI_WORKER_POOL != '' && github.event_name != 'schedule' && format('["self-hosted","{0}","starter-source-{1}","starter-run-{2}"]', vars.PLATFORM_CI_WORKER_POOL, github.sha, github.run_id) || format('["{0}"]', vars.PLATFORM_CI_AUX_RUNNER || vars.PLATFORM_CI_RUNNER || ((vars.PLATFORM_CI_LOCAL_ONLY == 'true' || vars.PLATFORM_CI_WORKER_POOL != '' || vars.PLATFORM_CI_AUX_RUNNER != '' || vars.PLATFORM_CI_RUNNER != '' || vars.PLATFORM_UPDATE_RUNNER != '' || vars.PLATFORM_UPDATE_DELIVERY_RUNNER != '') && 'starter-local-only-unconfigured' || 'ubuntu-latest'))) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup dependencies
        uses: ./.github/actions/setup-bun

      - name: Audit committed Bun dependencies
        run: bun run check:dependencies

  secrets-scan:
    name: Secrets Scan
    runs-on: ${{ fromJSON(vars.PLATFORM_CI_WORKER_POOL != '' && github.event_name != 'schedule' && format('["self-hosted","{0}","starter-source-{1}","starter-run-{2}"]', vars.PLATFORM_CI_WORKER_POOL, github.sha, github.run_id) || format('["{0}"]', vars.PLATFORM_CI_AUX_RUNNER || vars.PLATFORM_CI_RUNNER || ((vars.PLATFORM_CI_LOCAL_ONLY == 'true' || vars.PLATFORM_CI_WORKER_POOL != '' || vars.PLATFORM_CI_AUX_RUNNER != '' || vars.PLATFORM_CI_RUNNER != '' || vars.PLATFORM_UPDATE_RUNNER != '' || vars.PLATFORM_UPDATE_DELIVERY_RUNNER != '') && 'starter-local-only-unconfigured' || 'ubuntu-latest'))) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog native scan
        env:
          SCAN_EVENT: ${{ github.event_name }}
          SCAN_PR_BASE: ${{ github.event.pull_request.base.sha }}
          SCAN_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SCAN_BEFORE: ${{ github.event.before }}
          SCAN_AFTER: ${{ github.event.after }}
          SCAN_SHA: ${{ github.sha }}
        run: bash platform/tooling/scan-secrets.sh

  dependency-review:
    name: Dependency Review
    needs: paid-features
    runs-on: ${{ fromJSON(vars.PLATFORM_CI_WORKER_POOL != '' && github.event_name != 'schedule' && format('["self-hosted","{0}","starter-source-{1}","starter-run-{2}"]', vars.PLATFORM_CI_WORKER_POOL, github.sha, github.run_id) || format('["{0}"]', vars.PLATFORM_CI_AUX_RUNNER || vars.PLATFORM_CI_RUNNER || ((vars.PLATFORM_CI_LOCAL_ONLY == 'true' || vars.PLATFORM_CI_WORKER_POOL != '' || vars.PLATFORM_CI_AUX_RUNNER != '' || vars.PLATFORM_CI_RUNNER != '' || vars.PLATFORM_UPDATE_RUNNER != '' || vars.PLATFORM_UPDATE_DELIVERY_RUNNER != '') && 'starter-local-only-unconfigured' || 'ubuntu-latest'))) }}
    if: github.event_name == 'pull_request' && needs.paid-features.outputs.code_security == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Only deny GPL-3.0 for runtime dependencies
          # AGPL-3.0 removed since our only AGPL dep (TruffleHog) is a CI tool
          deny-licenses: GPL-3.0

  complete:
    name: Security Complete
    if: always()
    needs: [paid-features, codeql, dependency-audit, secrets-scan, dependency-review]
    runs-on: ${{ fromJSON(vars.PLATFORM_CI_WORKER_POOL != '' && github.event_name != 'schedule' && format('["self-hosted","{0}","starter-source-{1}","starter-run-{2}"]', vars.PLATFORM_CI_WORKER_POOL, github.sha, github.run_id) || format('["{0}"]', vars.PLATFORM_CI_AUX_RUNNER || vars.PLATFORM_CI_RUNNER || ((vars.PLATFORM_CI_LOCAL_ONLY == 'true' || vars.PLATFORM_CI_WORKER_POOL != '' || vars.PLATFORM_CI_AUX_RUNNER != '' || vars.PLATFORM_CI_RUNNER != '' || vars.PLATFORM_UPDATE_RUNNER != '' || vars.PLATFORM_UPDATE_DELIVERY_RUNNER != '') && 'starter-local-only-unconfigured' || 'ubuntu-latest'))) }}
    steps:
      - name: Require successful applicable security checks
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "$RESULTS" | jq -e --arg event "$EVENT_NAME" '
            .["paid-features"].result == "success" and
            (.["paid-features"].outputs.code_security == "true" or .["paid-features"].outputs.code_security == "false") and
            .["dependency-audit"].result == "success" and
            .["secrets-scan"].result == "success" and
            (.["codeql"].result == "success" or (.["codeql"].result == "skipped" and .["paid-features"].outputs.code_security == "false")) and
            (.["dependency-review"].result == "success" or (.["dependency-review"].result == "skipped" and ($event != "pull_request" or .["paid-features"].outputs.code_security == "false")))'
