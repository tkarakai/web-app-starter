name: Platform CI Admin

on:
  workflow_call:
    inputs:
      require_e2e:
        description: Require every E2E job for full commit verification
        type: boolean
        default: false
      git_sha:
        description: Source commit to test
        type: string
        required: false
        default: ""

concurrency:
  group: ci-admin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  # ============================================================
  # CHANGE DETECTION
  # ============================================================
  changes:
    name: Detect Changes
    runs-on: ${{ fromJSON(startsWith(github.workflow, 'CI ') && vars.PLATFORM_CI_WORKER_POOL != '' && format('["self-hosted","{0}","starter-source-{1}","starter-run-{2}"]', vars.PLATFORM_CI_WORKER_POOL, inputs.git_sha || github.sha, github.run_id) || format('["{0}"]', vars.PLATFORM_CI_RUNNER || 'ubuntu-latest')) }}
    outputs:
      should_run: ${{ inputs.git_sha != '' && 'true' || steps.act-all.outputs.should_run || steps.evaluate.outputs.should_run }}
      e2e: ${{ steps.act-all.outputs.e2e || steps.e2e.outputs.e2e }}
    steps:
      - name: Run all jobs in act
        if: ${{ env.ACT }}
        id: act-all
        run: |
          echo "Running in act — skipping change detection"
          echo "should_run=true" >> $GITHUB_OUTPUT
          echo "e2e=run" >> $GITHUB_OUTPUT

      - name: Checkout
        if: ${{ !env.ACT }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}

      - name: Resolve E2E policy
        if: ${{ !env.ACT }}
        id: e2e
        env:
          PR_E2E: ${{ vars.PLATFORM_CI_PR_E2E }}
          REQUIRE_E2E: ${{ inputs.require_e2e }}
          EVENT_NAME: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: ./platform/tooling/ci-e2e-policy.sh resolve

      - name: Detect file changes
        if: ${{ !env.ACT }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            admin:
              - 'platform/apps/admin/**'
            backend:
              - 'packages/backend/**'
            design-system:
              - 'platform/packages/design-system/**'
            auth:
              - 'platform/packages/auth*/**'
            root:
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - 'app.config.ts'
              - 'platform/packages/app-config/**'
              - 'platform/config/**'
              - 'eslint.config.mjs'
              - 'platform/tooling/**'

      - name: Evaluate changes
        if: ${{ !env.ACT }}
        id: evaluate
        run: |
          if [[ "${{ steps.filter.outputs.admin }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.backend }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.design-system }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.auth }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.root }}" == "true" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "Skipping admin — no relevant changes"
          fi

  # ============================================================
  # UNIT & COMPONENT TESTS
  # ============================================================
  test:
    name: Test
    runs-on: ${{ fromJSON(startsWith(github.workflow, 'CI ') && vars.PLATFORM_CI_WORKER_POOL != '' && format('["self-hosted","{0}","starter-source-{1}","starter-run-{2}"]', vars.PLATFORM_CI_WORKER_POOL, inputs.git_sha || github.sha, github.run_id) || format('["{0}"]', vars.PLATFORM_CI_RUNNER || 'ubuntu-latest')) }}
    needs: [changes]
    if: needs.changes.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}
      - uses: ./.github/actions/setup-bun

      - name: Run Bun tests
        run: cd platform/apps/admin && bun run test

      - name: Run Vitest with coverage
        run: cd platform/apps/admin && bun run test:coverage

      - name: Display coverage summary
        if: always()
        run: |
          JOB_DIR="/act-artifacts/admin/test"
          if [ -n "$ACT" ]; then
            mkdir -p "$JOB_DIR"
            SUMMARY_FILE="$JOB_DIR/step-summary.md"
          else
            SUMMARY_FILE="$GITHUB_STEP_SUMMARY"
          fi
          COVERAGE_FILE="platform/apps/admin/qa/coverage/coverage-summary.json"
          if [ -f "$COVERAGE_FILE" ]; then
            echo "## Coverage Summary (admin)" >> "$SUMMARY_FILE"
            echo "" >> "$SUMMARY_FILE"
            echo "| Metric | Coverage |" >> "$SUMMARY_FILE"
            echo "|--------|----------|" >> "$SUMMARY_FILE"
            echo "| Lines | $(jq -r '.total.lines.pct' "$COVERAGE_FILE")% |" >> "$SUMMARY_FILE"
            echo "| Branches | $(jq -r '.total.branches.pct' "$COVERAGE_FILE")% |" >> "$SUMMARY_FILE"
            echo "| Functions | $(jq -r '.total.functions.pct' "$COVERAGE_FILE")% |" >> "$SUMMARY_FILE"
            echo "| Statements | $(jq -r '.total.statements.pct' "$COVERAGE_FILE")% |" >> "$SUMMARY_FILE"
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && !env.ACT }}
        continue-on-error: true
        with:
          name: coverage-report-admin
          path: platform/apps/admin/qa/coverage/
          retention-days: ${{ vars.PLATFORM_CI_ARTIFACT_RETENTION_DAYS || 7 }}

      - name: Save job outputs (act)
        if: ${{ always() && env.ACT }}
        run: |
          JOB_DIR="/act-artifacts/admin/test"
          mkdir -p "$JOB_DIR/artifacts"
          [ -d "platform/apps/admin/qa/coverage" ] && cp -r "platform/apps/admin/qa/coverage" "$JOB_DIR/artifacts/coverage-admin" 2>/dev/null || true

  # ============================================================
  # BUILD & BUNDLE SIZE
  # ============================================================
  build:
    name: Build & Bundle Size
    runs-on: ${{ fromJSON(startsWith(github.workflow, 'CI ') && vars.PLATFORM_CI_WORKER_POOL != '' && format('["self-hosted","{0}","starter-source-{1}","starter-run-{2}"]', vars.PLATFORM_CI_WORKER_POOL, inputs.git_sha || github.sha, github.run_id) || format('["{0}"]', vars.PLATFORM_CI_RUNNER || 'ubuntu-latest')) }}
    needs: [changes]
    if: needs.changes.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}
      - uses: ./.github/actions/setup-bun

      - name: Build
        run: bunx turbo build --filter=@repo/admin...
        env:
          CONVEX_URL: "https://placeholder.convex.cloud"
          CONVEX_SITE_URL: "https://placeholder.convex.site"
          APP_ORIGIN: ${{ env.APP_CONFIG_ORIGIN_ADMIN }}

      - name: Check bundle size
        run: cd platform/apps/admin && bun run size

  # ============================================================
  # E2E ON DEMAND (PLATFORM_CI_PR_E2E=on-demand)
  # ============================================================
  # Fails a ready PR without the run-e2e label, so `CI <App> Complete` can't pass
  # until E2E has run on the head. Adding the label re-runs this job and E2E
  # (platform-ci-e2e-request.yml).
  e2e-required:
    name: E2E Required
    runs-on: ${{ fromJSON(startsWith(github.workflow, 'CI ') && vars.PLATFORM_CI_WORKER_POOL != '' && format('["self-hosted","{0}","starter-source-{1}","starter-run-{2}"]', vars.PLATFORM_CI_WORKER_POOL, inputs.git_sha || github.sha, github.run_id) || format('["{0}"]', vars.PLATFORM_CI_RUNNER || 'ubuntu-latest')) }}
    needs: [changes]
    if: needs.changes.outputs.should_run == 'true' && needs.changes.outputs.e2e == 'on-demand'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}
          sparse-checkout: platform/tooling/ci-e2e-policy.sh
          sparse-checkout-cone-mode: false

      - name: Check for the run-e2e label
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ./platform/tooling/ci-e2e-policy.sh label

  # ============================================================
  # E2E TESTS
  # ============================================================
  e2e:
    name: E2E Tests
    runs-on: ${{ fromJSON(startsWith(github.workflow, 'CI ') && vars.PLATFORM_CI_WORKER_POOL != '' && format('["self-hosted","{0}","starter-source-{1}","starter-run-{2}"]', vars.PLATFORM_CI_WORKER_POOL, inputs.git_sha || github.sha, github.run_id) || format('["{0}"]', vars.PLATFORM_CI_RUNNER || 'ubuntu-latest')) }}
    needs: [changes, build, e2e-required]
    # `!cancelled()` lets E2E run when e2e-required was skipped (mode always or a forced run).
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.changes.outputs.e2e == 'run' || needs.e2e-required.result == 'success') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-playwright
        with:
          working-directory: platform/apps/admin

      - name: Run Playwright tests
        run: cd platform/apps/admin && bunx playwright test --project=chromium
        env:
          CI: true

      - name: Show dev logs on failure
        if: failure()
        run: |
          echo "=== Convex Dev Log ==="
          cat .convex-dev.log 2>/dev/null || echo "No Convex log found"
          echo ""
          echo "=== Next.js Dev Log (admin) ==="
          cat .next-admin.log 2>/dev/null || echo "No Next.js log found"

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() && !env.ACT }}
        continue-on-error: true
        with:
          name: playwright-report-admin
          path: platform/apps/admin/qa/playwright-report/
          retention-days: ${{ vars.PLATFORM_CI_ARTIFACT_RETENTION_DAYS || 7 }}

      - name: Upload visual snapshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() && !env.ACT }}
        continue-on-error: true
        with:
          name: visual-snapshots-admin
          path: platform/apps/admin/qa/e2e/__screenshots__/
          retention-days: ${{ vars.PLATFORM_CI_ARTIFACT_RETENTION_DAYS || 7 }}
          if-no-files-found: ignore

      - name: Save job outputs (act)
        if: ${{ always() && env.ACT }}
        run: |
          JOB_DIR="/act-artifacts/admin/e2e"
          mkdir -p "$JOB_DIR/artifacts"
          [ -d "platform/apps/admin/qa/playwright-report" ] && cp -r "platform/apps/admin/qa/playwright-report" "$JOB_DIR/artifacts/playwright-report-admin" 2>/dev/null || true
          [ -d "platform/apps/admin/qa/e2e/__screenshots__" ] && cp -r "platform/apps/admin/qa/e2e/__screenshots__" "$JOB_DIR/artifacts/visual-snapshots-admin" 2>/dev/null || true
