name: CI Storybook

# App-owned caller. The checks live in the platform's reusable workflow
# (platform-ci-storybook.yml, replaced on platform upgrade); edit the triggers here.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  platform:
    name: Platform
    uses: ./.github/workflows/platform-ci-storybook.yml

  # The required status check (branch rules name it).
  complete:
    name: CI Storybook Complete
    needs: [platform]
    if: always()
    runs-on: ${{ fromJSON(vars.PLATFORM_CI_WORKER_POOL != '' && format('["self-hosted","{0}","starter-source-{1}","starter-run-{2}"]', vars.PLATFORM_CI_WORKER_POOL, github.sha, github.run_id) || format('["{0}"]', vars.PLATFORM_CI_AUX_RUNNER || vars.PLATFORM_CI_RUNNER || (vars.PLATFORM_CI_LOCAL_ONLY == 'true' && 'starter-local-only-unconfigured' || 'ubuntu-latest'))) }}
    steps:
      - name: Require the platform workflow to pass
        run: |
          echo "Platform CI Storybook: ${{ needs.platform.result }}"
          [[ "${{ needs.platform.result }}" == "success" ]]
