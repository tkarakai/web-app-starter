name: Platform CI E2E Request

# PLATFORM_CI_PR_E2E=on-demand: adding the run-e2e label to a pull request re-runs
# the failed "E2E Required" jobs of the CI runs on its head commit. Re-running a
# failed job also re-runs the jobs that depend on it: the E2E tests and the
# `CI <App> Complete` check. Other labels and other modes skip the job (no cost).
# Platform zone: replaced on upgrade. Triggers live in the app-owned ci-e2e-request.yml.

on:
  workflow_call:

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    name: Re-run E2E Required
    if: github.event.label.name == 'run-e2e' && vars.PLATFORM_CI_PR_E2E == 'on-demand'
    runs-on: ${{ vars.PLATFORM_CI_AUX_RUNNER || vars.PLATFORM_CI_RUNNER || ((vars.PLATFORM_CI_LOCAL_ONLY == 'true' || vars.PLATFORM_CI_WORKER_POOL != '' || vars.PLATFORM_CI_AUX_RUNNER != '' || vars.PLATFORM_CI_RUNNER != '' || vars.PLATFORM_UPDATE_RUNNER != '' || vars.PLATFORM_UPDATE_DELIVERY_RUNNER != '') && 'starter-local-only-unconfigured' || 'ubuntu-latest') }}
    timeout-minutes: 5
    steps:
      - name: Re-run the waiting checks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const headSha = context.payload.pull_request.head.sha;
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, head_sha: headSha, event: 'pull_request', per_page: 100,
            });
            const status = async (id) => (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: id })).data.status;
            let rerun = 0;
            const failed = [];
            for (const run of runs) {
              if (run.id === context.runId) continue;
              try {
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  owner, repo, run_id: run.id, filter: 'latest', per_page: 100,
                });
                const waiting = jobs.some((job) => job.name.endsWith('E2E Required') && job.conclusion === 'failure');
                if (!waiting) continue;
                // A run still building can't be re-run: cancel it, then re-run its failed and cancelled
                // jobs. The listing may be stale, so read the status again; a run that finishes in
                // between rejects the cancel, which is fine.
                if (await status(run.id) !== 'completed') {
                  try {
                    await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                  } catch (error) {
                    if (error.status !== 409) throw error;
                  }
                  for (let i = 0; i < 24 && await status(run.id) !== 'completed'; i++) {
                    await new Promise((resolve) => setTimeout(resolve, 5000));
                  }
                }
                await github.rest.actions.reRunWorkflowFailedJobs({ owner, repo, run_id: run.id });
                core.info(`Re-ran ${run.name}: ${run.html_url}`);
                rerun++;
              } catch (error) {
                core.warning(`Could not re-run ${run.name} (${run.html_url}): ${error.message}`);
                failed.push(run.name);
              }
            }
            if (failed.length) {
              core.setFailed(`Re-run these by hand (Actions → the run → Re-run failed jobs): ${failed.join(', ')}`);
            } else if (rerun === 0) {
              core.notice('No CI run on this commit is waiting for E2E. Runs that start from now on see the label.');
            }
