name: Renovate

# Automated dependency updates with a 10-day stability cooldown.
# "Self-hosted" Renovate means we run the bot ourselves in this workflow.
# Runner policy: platform/docs/ci-workers.md#keep-every-actions-job-local.
# See platform/docs/dependency-updates.md for setup, the RENOVATE_TOKEN secret, and policy.
on:
  schedule:
    # Periodic runs: Monday & Thursday at 06:00 UTC (GitHub's scheduler; runs may
    # be delayed under load, and GitHub pauses schedules after 60 days of repo inactivity).
    - cron: "0 6 * * 1,4"
  workflow_dispatch:
    # Manual "run now" — optionally raise log verbosity for debugging.
    inputs:
      logLevel:
        description: "Renovate log level"
        required: false
        default: "info"
        type: choice
        options:
          - info
          - debug

# Never run two Renovate jobs at once (they'd fight over branches/PRs).
concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ${{ fromJSON(github.event.repository.private != true && '["ubuntu-latest"]' || ((vars.PLATFORM_CI_LOCAL_ONLY == 'true' || vars.PLATFORM_CI_WORKER_POOL != '' || vars.PLATFORM_CI_AUX_RUNNER != '' || vars.PLATFORM_CI_RUNNER != '' || vars.PLATFORM_UPDATE_RUNNER != '' || vars.PLATFORM_UPDATE_DELIVERY_RUNNER != '') && format('["self-hosted",{0}]', toJSON(vars.PLATFORM_CI_AUX_RUNNER || vars.PLATFORM_CI_RUNNER || 'starter-local-only-unconfigured')) || '["ubuntu-latest"]')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Renovate
        uses: renovatebot/github-action@f3a31a786096ba6b40d0f0ffe11a494ef73bfa7c # v46.3.4
        with:
          # No configurationFile: Renovate reads the repository's renovate.json as repo config,
          # which resolves its local> preset (platform/config/renovate-preset.json).
          # RENOVATE_TOKEN must be a fine-grained PAT (or GitHub App token), NOT the
          # default GITHUB_TOKEN — otherwise Renovate's PRs won't trigger the ci-* workflows.
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          # Autodiscover is off: operate only on this repo.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
