name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: "Git SHA to deploy (must have been deployed to staging)"
        required: true
        type: string
      confirm:
        description: "Type 'deploy-production' to confirm"
        required: true
        type: string

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─── Validate inputs and find staging artifacts ──────────────────
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    outputs:
      staging-run-id: ${{ steps.find-run.outputs.run-id }}
    steps:
      - name: Verify confirmation string
        if: inputs.confirm != 'deploy-production'
        run: |
          echo "::error::Confirmation failed. You must type 'deploy-production' to confirm."
          exit 1

      - name: Verify SHA was deployed to staging
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ inputs.git_sha }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Check for staging deployment tag (paginate to avoid missing older tags)
            try {
              const tags = await github.paginate(github.rest.git.listMatchingRefs, {
                owner,
                repo,
                ref: `tags/deploy/staging/`,
              });

              const stagingTag = tags.find(tag => tag.object.sha === sha || tag.ref.endsWith(`/${sha}`));

              if (!stagingTag) {
                // Also check short SHA matches
                const shortSha = sha.substring(0, 7);
                const tagWithShort = tags.find(tag => tag.ref.includes(shortSha));
                if (!tagWithShort) {
                  core.setFailed(`SHA ${sha} has no staging deployment tag. Deploy to staging first.`);
                  return;
                }
              }

              console.log(`Verified: ${sha} was deployed to staging`);
            } catch (error) {
              core.setFailed(`Failed to verify staging deployment: ${error.message}`);
            }

      - name: Verify CI gate passed
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ inputs.git_sha }}';
            const { data: { statuses } } = await github.rest.repos.getCombinedStatusForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
            });

            const gate = statuses.find(s => s.context === 'ci/gate-passed');
            if (!gate || gate.state !== 'success') {
              core.setFailed(`CI gate has not passed for SHA ${sha}`);
              return;
            }
            console.log('CI gate verified');

      - name: Find staging workflow run with artifacts
        id: find-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Looking for successful staging workflow run for SHA ${{ inputs.git_sha }}..."

          RUN_ID=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/cd-staging.yml/runs?head_sha=${{ inputs.git_sha }}&status=success&per_page=5" \
            --jq '.workflow_runs[0].id')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No successful staging workflow run found for SHA ${{ inputs.git_sha }}"
            exit 1
          fi

          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Found staging run: $RUN_ID"

      - name: Verify staging artifacts exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Verifying required artifacts exist in staging run ${{ steps.find-run.outputs.run-id }}..."

          MISSING_ARTIFACTS=()
          for APP in web admin landing; do
            ARTIFACT_NAME="${APP}-${{ inputs.git_sha }}"
            if ! gh run view ${{ steps.find-run.outputs.run-id }} --json artifacts \
                --jq ".artifacts[] | select(.name == \"${ARTIFACT_NAME}\") | .name" | grep -q .; then
              echo "::error::Missing artifact ${ARTIFACT_NAME} from staging run"
              MISSING_ARTIFACTS+=("${ARTIFACT_NAME}")
            else
              echo "✅ Found artifact: ${ARTIFACT_NAME}"
            fi
          done

          if [ ${#MISSING_ARTIFACTS[@]} -gt 0 ]; then
            echo "::error::${#MISSING_ARTIFACTS[@]} artifact(s) missing. Artifacts may have expired (90-day retention)."
            exit 1
          fi

          echo "All required artifacts verified"

  # ─── Deploy Convex backend (before frontend) ────────────────────
  deploy-convex:
    name: Deploy Convex (Production)
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/deploy-convex
        with:
          deploy-key: ${{ secrets.CONVEX_DEPLOY_KEY }}
          environment: production

  # ─── Promote staging artifacts to production (no rebuild) ────────
  deploy-web:
    name: Deploy Web (Production)
    needs: [validate, deploy-convex]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/deploy-vercel
        id: deploy
        with:
          app: web
          environment: production
          artifact-name: web-${{ inputs.git_sha }}
          tarball: web.tar.gz
          checksum-file: web.tar.gz.sha256
          run-id: ${{ needs.validate.outputs.staging-run-id }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_WEB }}

  deploy-admin:
    name: Deploy Admin (Production)
    needs: [validate, deploy-convex]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/deploy-vercel
        id: deploy
        with:
          app: admin
          environment: production
          artifact-name: admin-${{ inputs.git_sha }}
          tarball: admin.tar.gz
          checksum-file: admin.tar.gz.sha256
          run-id: ${{ needs.validate.outputs.staging-run-id }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}

  deploy-landing:
    name: Deploy Landing (Production)
    needs: [validate, deploy-convex]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/deploy-vercel
        id: deploy
        with:
          app: landing
          environment: production
          artifact-name: landing-${{ inputs.git_sha }}
          tarball: landing.tar.gz
          checksum-file: landing.tar.gz.sha256
          run-id: ${{ needs.validate.outputs.staging-run-id }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_LANDING }}

  # ─── Post-deploy health checks and tagging ───────────────────────
  post-deploy:
    name: Post-Deploy Verification
    needs: [validate, deploy-web, deploy-admin, deploy-landing]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}

      - name: Health check all production apps
        uses: actions/github-script@v7
        with:
          script: |
            const apps = [
              { name: 'web', url: '${{ needs.deploy-web.outputs.deployment-url }}' },
              { name: 'admin', url: '${{ needs.deploy-admin.outputs.deployment-url }}' },
              { name: 'landing', url: '${{ needs.deploy-landing.outputs.deployment-url }}' },
            ];

            const results = [];
            for (const app of apps) {
              if (!app.url) {
                results.push(`❌ ${app.name}: No deployment URL`);
                continue;
              }
              try {
                const response = await fetch(app.url, {
                  method: 'GET',
                  redirect: 'follow',
                  signal: AbortSignal.timeout(30000),
                });
                if (response.ok) {
                  results.push(`✅ ${app.name}: ${response.status} (${app.url})`);
                } else {
                  results.push(`⚠️ ${app.name}: ${response.status} (${app.url})`);
                }
              } catch (error) {
                results.push(`❌ ${app.name}: ${error.message}`);
              }
            }

            const summary = results.join('\n');
            console.log(summary);

            core.summary.addHeading('Production Health Checks', 3);
            core.summary.addCodeBlock(summary);
            await core.summary.write();

            const failed = results.filter(r => r.startsWith('❌'));
            if (failed.length > 0) {
              core.setFailed(`${failed.length} health check(s) failed`);
            }

      - name: Create production deployment tag
        run: |
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config user.name "${{ github.actor }}"

          TIMESTAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          TAG="deploy/production/${TIMESTAMP}/${{ inputs.git_sha }}"
          git tag -a "${TAG}" "${{ inputs.git_sha }}" \
            -m "Production deployment at ${TIMESTAMP}" \
            -m "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -m "Promoted from staging run: ${{ needs.validate.outputs.staging-run-id }}"
          git push origin "${TAG}"

          echo "### Production Deployment Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA:** ${{ inputs.git_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** ${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Timestamp:** ${TIMESTAMP}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Promoted from staging run:** ${{ needs.validate.outputs.staging-run-id }}" >> "$GITHUB_STEP_SUMMARY"
