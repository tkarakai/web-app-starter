name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: "Git SHA to deploy (must have been deployed to staging)"
        required: true
        type: string
      confirm:
        description: "Type 'deploy-production' to confirm"
        required: true
        type: string

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─── Validate inputs and staging deployment ──────────────────────
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation string
        if: inputs.confirm != 'deploy-production'
        run: |
          echo "::error::Confirmation failed. You must type 'deploy-production' to confirm."
          exit 1

      - name: Verify SHA was deployed to staging
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const sha = '${{ inputs.git_sha }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Check for staging deployment tag (paginate to avoid missing older tags)
            try {
              const tags = await github.paginate(github.rest.git.listMatchingRefs, {
                owner,
                repo,
                ref: `tags/deploy/staging/`,
              });

              const stagingTag = tags.find(tag => tag.object.sha === sha || tag.ref.endsWith(`/${sha}`));

              if (!stagingTag) {
                // Also check short SHA matches
                const shortSha = sha.substring(0, 7);
                const tagWithShort = tags.find(tag => tag.ref.includes(shortSha));
                if (!tagWithShort) {
                  core.setFailed(`SHA ${sha} has no staging deployment tag. Deploy to staging first.`);
                  return;
                }
              }

              console.log(`Verified: ${sha} was deployed to staging`);
            } catch (error) {
              core.setFailed(`Failed to verify staging deployment: ${error.message}`);
            }

      - name: Verify CI gate passed
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const sha = '${{ inputs.git_sha }}';
            const { data: { statuses } } = await github.rest.repos.getCombinedStatusForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
            });

            const gate = statuses.find(s => s.context === 'ci/gate-passed');
            if (!gate || gate.state !== 'success') {
              core.setFailed(`CI gate has not passed for SHA ${sha}`);
              return;
            }
            console.log('CI gate verified');

  # ─── Locate the staging build to promote ─────────────────────────
  #
  # web and admin are NOT rebuilt here. Their artifacts carry no environment
  # identity, so production deploys the exact bytes that were tested on staging.
  # See docs/claude/build-once-promote-plan.md
  resolve-staging-build:
    name: Resolve Staging Build
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}
    steps:
      - name: Find the staging run that built this SHA
        id: find
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const sha = '${{ inputs.git_sha }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const required = [`web-${sha}`, `admin-${sha}`];

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              { owner, repo, workflow_id: 'cd-staging.yml', head_sha: sha, per_page: 100 },
            );
            const candidates = runs
              .filter((run) => run.conclusion === 'success')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            if (candidates.length === 0) {
              core.setFailed(
                `No successful cd-staging run found for ${sha}. ` +
                `Production promotes the artifact staging built; deploy this SHA to staging first.`
              );
              return;
            }

            for (const run of candidates) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: run.id, per_page: 100,
              });
              const names = data.artifacts.filter((a) => !a.expired).map((a) => a.name);
              const missing = required.filter((name) => !names.includes(name));

              if (missing.length === 0) {
                core.setOutput('run-id', String(run.id));
                core.summary.addHeading('Promoting staging build', 3);
                core.summary.addRaw(
                  `Run [${run.id}](${run.html_url}) — ${required.join(', ')}`
                );
                await core.summary.write();
                console.log(`Promoting artifacts from staging run ${run.id}`);
                return;
              }
              console.log(`Run ${run.id} is missing: ${missing.join(', ')}`);
            }

            // cd-staging only builds the apps whose files changed, so a push-triggered
            // run for this SHA may legitimately have no web/admin artifact. Promoting a
            // different SHA's artifact would silently deploy untested bytes, so fail
            // instead and let the operator produce a complete set.
            core.setFailed(
              `Found ${candidates.length} successful cd-staging run(s) for ${sha}, but none ` +
              `contain both ${required.join(' and ')} (change detection skips unchanged apps, ` +
              `and artifacts expire after 90 days). Re-run cd-staging for this SHA with ` +
              `force_deploy=true, then retry.`
            );

  # ─── Build landing for production ────────────────────────────────
  #
  # landing is a static export (output: "export"), so it has no server at runtime
  # and cannot read runtime configuration. Its artifact is environment-specific
  # and must be rebuilt per environment.
  build-landing:
    name: Build Landing (Production)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.git_sha }}
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/build-app
        id: build
        with:
          app: landing
          environment: production
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_LANDING }}

  # ─── Attest build provenance ─────────────────────────────────────
  #
  # Only landing is attested here — it is the only artifact this workflow builds.
  # The promoted web and admin artifacts were attested by the staging run that
  # produced them, which is the run that actually built those bytes.
  attest:
    name: Attest Build Provenance
    needs: build-landing
    runs-on: ubuntu-latest
    steps:
      - name: Download landing artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: landing-${{ inputs.git_sha }}
          path: artifacts/landing-${{ inputs.git_sha }}

      - name: Attest landing artifact
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: artifacts/landing-${{ inputs.git_sha }}/landing.tar.gz

  # ─── Deploy Convex backend (before frontend) ────────────────────
  deploy-convex:
    name: Deploy Convex (Production)
    needs: [resolve-staging-build, build-landing]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.git_sha }}
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/deploy-convex
        with:
          deploy-key: ${{ secrets.CONVEX_DEPLOY_KEY }}
          environment: production

  # ─── Promote web and admin, deploy landing ───────────────────────
  deploy-web:
    name: Deploy Web (Production)
    needs: [resolve-staging-build, deploy-convex]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.git_sha }}
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/deploy-vercel
        id: deploy
        with:
          app: web
          environment: production
          artifact-name: web-${{ inputs.git_sha }}
          tarball: web.tar.gz
          checksum-file: web.tar.gz.sha256
          run-id: ${{ needs.resolve-staging-build.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          expected-sha: ${{ inputs.git_sha }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_WEB }}

  deploy-admin:
    name: Deploy Admin (Production)
    needs: [resolve-staging-build, deploy-convex]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.git_sha }}
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/deploy-vercel
        id: deploy
        with:
          app: admin
          environment: production
          artifact-name: admin-${{ inputs.git_sha }}
          tarball: admin.tar.gz
          checksum-file: admin.tar.gz.sha256
          run-id: ${{ needs.resolve-staging-build.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          expected-sha: ${{ inputs.git_sha }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}

  deploy-landing:
    name: Deploy Landing (Production)
    needs: deploy-convex
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.git_sha }}
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/deploy-vercel
        id: deploy
        with:
          app: landing
          environment: production
          artifact-name: landing-${{ inputs.git_sha }}
          tarball: landing.tar.gz
          checksum-file: landing.tar.gz.sha256
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_LANDING }}

  # ─── Post-deploy health checks and tagging ───────────────────────
  post-deploy:
    name: Post-Deploy Verification
    needs: [deploy-web, deploy-admin, deploy-landing]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.git_sha }}

      - name: Health check all production apps
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const apps = [
              { name: 'web', url: '${{ needs.deploy-web.outputs.deployment-url }}' },
              { name: 'admin', url: '${{ needs.deploy-admin.outputs.deployment-url }}' },
              { name: 'landing', url: '${{ needs.deploy-landing.outputs.deployment-url }}' },
            ];

            const results = [];
            for (const app of apps) {
              if (!app.url) {
                results.push(`❌ ${app.name}: No deployment URL`);
                continue;
              }
              try {
                const response = await fetch(app.url, {
                  method: 'GET',
                  redirect: 'follow',
                  signal: AbortSignal.timeout(30000),
                });
                if (response.ok) {
                  results.push(`✅ ${app.name}: ${response.status} (${app.url})`);
                } else {
                  results.push(`⚠️ ${app.name}: ${response.status} (${app.url})`);
                }
              } catch (error) {
                results.push(`❌ ${app.name}: ${error.message}`);
              }
            }

            const summary = results.join('\n');
            console.log(summary);

            core.summary.addHeading('Production Health Checks', 3);
            core.summary.addCodeBlock(summary);
            await core.summary.write();

            const failed = results.filter(r => r.startsWith('❌'));
            if (failed.length > 0) {
              core.setFailed(`${failed.length} health check(s) failed`);
            }

      - name: Create production deployment tag
        run: |
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config user.name "${{ github.actor }}"

          TIMESTAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          TAG="deploy/production/${TIMESTAMP}/${{ inputs.git_sha }}"
          git tag -a "${TAG}" "${{ inputs.git_sha }}" \
            -m "Production deployment at ${TIMESTAMP}" \
            -m "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin "${TAG}"

          echo "### Production Deployment Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA:** ${{ inputs.git_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** ${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Timestamp:** ${TIMESTAMP}" >> "$GITHUB_STEP_SUMMARY"
