name: Deploy Production

run-name: "Deploy production ${{ inputs.git_sha }} [ops:${{ inputs.request_id || github.run_id }}]"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation ID supplied by the ops CLI
        type: string
        required: false
      git_sha:
        description: "Git SHA to deploy (must have been deployed to staging)"
        required: true
        type: string
      confirm:
        description: "Type 'deploy-production' to confirm"
        required: true
        type: string

env:
  OPS_SELECTED_SHA: ${{ inputs.git_sha }}

permissions:
  contents: write
  actions: read
  deployments: write
  id-token: write
  attestations: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─── Validate inputs and staging deployment ──────────────────────
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation string
        if: inputs.confirm != 'deploy-production'
        run: |
          echo "::error::Confirmation failed. You must type 'deploy-production' to confirm."
          exit 1

      - name: Verify SHA was deployed to staging
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const sha = process.env.OPS_SELECTED_SHA;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Check for staging deployment tag (paginate to avoid missing older tags)
            try {
              const tags = await github.paginate(github.rest.git.listMatchingRefs, {
                owner,
                repo,
                ref: `tags/deploy/staging/`,
              });

              const stagingTag = tags.find(tag => tag.ref.endsWith(`/${sha}`));
              // A tag's name is only a claim: resolve annotated tags to the commit.
              if (stagingTag) {
                let object = stagingTag.object;
                for (let depth = 0; object?.type === 'tag' && depth < 5; depth++) {
                  const detail = await github.rest.git.getTag({ owner, repo, tag_sha: object.sha });
                  object = detail.data.object;
                }
                if (object?.type !== 'commit' || object.sha !== sha) {
                  throw new Error('Deployment tag target does not match its SHA suffix.');
                }
              }
              if (!/^[a-f0-9]{40}$/.test(sha) || !stagingTag) {
                core.setFailed(`Full SHA ${sha} has no exact staging deployment tag.`);
                return;
              }

              console.log(`Verified: ${sha} was deployed to staging`);
            } catch (error) {
              core.setFailed(`Failed to verify staging deployment: ${error.message}`);
            }

      - name: Verify CI gate passed
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const sha = process.env.OPS_SELECTED_SHA;
            const { data: { statuses } } = await github.rest.repos.getCombinedStatusForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
            });

            const gate = statuses.find(s => s.context === 'ci/gate-passed');
            if (!gate || gate.state !== 'success') {
              core.setFailed(`CI gate has not passed for SHA ${sha}`);
              return;
            }
            console.log('CI gate verified');

  # ─── Resolve each app's artifact by its build-input hash ─────────
  #
  # Artifacts are content-addressed, so this resolves rather than rebuilds:
  # web and admin hash identically on staging and production, so their staging
  # artifacts are found and reused — production deploys the bytes staging tested.
  # landing and landing-static hash their inlined, environment-specific config,
  # so they legitimately miss here and are built for production.
  # A miss also covers an artifact that has aged past the 90-day retention.
  # See docs/claude/build-once-promote-plan.md
  build-web:
    name: Resolve Web Artifact (Production)
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      tarball: ${{ steps.build.outputs.tarball }}
      checksum-file: ${{ steps.build.outputs.checksum-file }}
      input-hash: ${{ steps.build.outputs.input-hash }}
      run-id: ${{ steps.build.outputs.run-id }}
      artifact-id: ${{ steps.build.outputs.artifact-id }}
      built-sha: ${{ steps.build.outputs.built-sha }}
      reused: ${{ steps.build.outputs.reused }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.git_sha }}
      - name: Checkout workflow tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ops-workflow
          sparse-checkout: .github
          persist-credentials: false
      - uses: ./.ops-workflow/.github/actions/setup-bun
      - uses: ./.ops-workflow/.github/actions/build-app
        id: build
        with:
          app: web
          environment: production
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build-admin:
    name: Resolve Admin Artifact (Production)
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      tarball: ${{ steps.build.outputs.tarball }}
      checksum-file: ${{ steps.build.outputs.checksum-file }}
      input-hash: ${{ steps.build.outputs.input-hash }}
      run-id: ${{ steps.build.outputs.run-id }}
      artifact-id: ${{ steps.build.outputs.artifact-id }}
      built-sha: ${{ steps.build.outputs.built-sha }}
      reused: ${{ steps.build.outputs.reused }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.git_sha }}
      - name: Checkout workflow tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ops-workflow
          sparse-checkout: .github
          persist-credentials: false
      - uses: ./.ops-workflow/.github/actions/setup-bun
      - uses: ./.ops-workflow/.github/actions/build-app
        id: build
        with:
          app: admin
          environment: production
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build-landing:
    name: Resolve Landing Artifact (Production)
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      tarball: ${{ steps.build.outputs.tarball }}
      checksum-file: ${{ steps.build.outputs.checksum-file }}
      input-hash: ${{ steps.build.outputs.input-hash }}
      run-id: ${{ steps.build.outputs.run-id }}
      artifact-id: ${{ steps.build.outputs.artifact-id }}
      built-sha: ${{ steps.build.outputs.built-sha }}
      reused: ${{ steps.build.outputs.reused }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.git_sha }}
      - name: Checkout workflow tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ops-workflow
          sparse-checkout: .github
          persist-credentials: false
      - uses: ./.ops-workflow/.github/actions/setup-bun
      - uses: ./.ops-workflow/.github/actions/build-app
        id: build
        with:
          app: landing
          environment: production
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_LANDING }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ─── Attest provenance for anything actually built here ──────────
  attest:
    name: Attest Build Provenance
    needs: [build-web, build-admin, build-landing]
    if: >-
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      (needs.build-web.outputs.reused == 'false' ||
       needs.build-admin.outputs.reused == 'false' ||
       needs.build-landing.outputs.reused == 'false')
    runs-on: ubuntu-latest
    steps:
      - name: Download web artifact
        if: needs.build-web.outputs.reused == 'false'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build-web.outputs.artifact-name }}
          path: artifacts/web
      - name: Attest web artifact
        if: needs.build-web.outputs.reused == 'false'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: artifacts/web/web.tar.gz
      - name: Download admin artifact
        if: needs.build-admin.outputs.reused == 'false'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build-admin.outputs.artifact-name }}
          path: artifacts/admin
      - name: Attest admin artifact
        if: needs.build-admin.outputs.reused == 'false'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: artifacts/admin/admin.tar.gz
      - name: Download landing artifact
        if: needs.build-landing.outputs.reused == 'false'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build-landing.outputs.artifact-name }}
          path: artifacts/landing

      - name: Attest landing artifact
        if: needs.build-landing.outputs.reused == 'false'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: artifacts/landing/landing.tar.gz

  # ─── Deploy Convex backend (before frontend) ────────────────────
  deploy-convex:
    name: Deploy Convex (Production)
    needs: [build-web, build-admin, build-landing]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.git_sha }}
      - name: Checkout workflow tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ops-workflow
          sparse-checkout: .github
          persist-credentials: false
      - uses: ./.ops-workflow/.github/actions/setup-bun
      - uses: ./.ops-workflow/.github/actions/deploy-convex
        with:
          deploy-key: ${{ secrets.CONVEX_DEPLOY_KEY }}
          environment: production

  deploy-web:
    name: Deploy Web (Production)
    needs: [build-web, deploy-convex]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
      built-sha: ${{ steps.deploy.outputs.built-sha }}
      checksum: ${{ steps.deploy.outputs.checksum }}
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.git_sha }}
      - name: Checkout workflow tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ops-workflow
          sparse-checkout: .github
          persist-credentials: false
      - uses: ./.ops-workflow/.github/actions/setup-bun
      - uses: ./.ops-workflow/.github/actions/deploy-vercel
        id: deploy
        with:
          app: web
          environment: production
          artifact-name: ${{ needs.build-web.outputs.artifact-name }}
          tarball: ${{ needs.build-web.outputs.tarball }}
          checksum-file: ${{ needs.build-web.outputs.checksum-file }}
          run-id: ${{ needs.build-web.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deployed-commit: ${{ inputs.git_sha }}
          logical-environment: production
          request-id: ${{ inputs.request_id }}
          expected-hash: ${{ needs.build-web.outputs.input-hash }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_WEB }}

  deploy-admin:
    name: Deploy Admin (Production)
    needs: [build-admin, deploy-convex]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
      built-sha: ${{ steps.deploy.outputs.built-sha }}
      checksum: ${{ steps.deploy.outputs.checksum }}
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.git_sha }}
      - name: Checkout workflow tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ops-workflow
          sparse-checkout: .github
          persist-credentials: false
      - uses: ./.ops-workflow/.github/actions/setup-bun
      - uses: ./.ops-workflow/.github/actions/deploy-vercel
        id: deploy
        with:
          app: admin
          environment: production
          artifact-name: ${{ needs.build-admin.outputs.artifact-name }}
          tarball: ${{ needs.build-admin.outputs.tarball }}
          checksum-file: ${{ needs.build-admin.outputs.checksum-file }}
          run-id: ${{ needs.build-admin.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deployed-commit: ${{ inputs.git_sha }}
          logical-environment: production
          request-id: ${{ inputs.request_id }}
          expected-hash: ${{ needs.build-admin.outputs.input-hash }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}

  deploy-landing:
    name: Deploy Landing (Production)
    needs: [build-landing, deploy-convex]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
      built-sha: ${{ steps.deploy.outputs.built-sha }}
      checksum: ${{ steps.deploy.outputs.checksum }}
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.git_sha }}
      - name: Checkout workflow tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ops-workflow
          sparse-checkout: .github
          persist-credentials: false
      - uses: ./.ops-workflow/.github/actions/setup-bun
      - uses: ./.ops-workflow/.github/actions/deploy-vercel
        id: deploy
        with:
          app: landing
          environment: production
          artifact-name: ${{ needs.build-landing.outputs.artifact-name }}
          tarball: ${{ needs.build-landing.outputs.tarball }}
          checksum-file: ${{ needs.build-landing.outputs.checksum-file }}
          run-id: ${{ needs.build-landing.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deployed-commit: ${{ inputs.git_sha }}
          logical-environment: production
          request-id: ${{ inputs.request_id }}
          expected-hash: ${{ needs.build-landing.outputs.input-hash }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_LANDING }}

  # ─── Post-deploy health checks and tagging ───────────────────────
  post-deploy:
    outputs:
      health: ${{ steps.health.outcome }}
    name: Post-Deploy Verification
    needs: [deploy-web, deploy-admin, deploy-landing, attest]
    if: >-
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      needs.deploy-web.result == 'success' &&
      needs.deploy-admin.result == 'success' &&
      needs.deploy-landing.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.git_sha }}

      - name: Health check all production apps
        id: health
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const apps = [
              { name: 'web', url: '${{ needs.deploy-web.outputs.deployment-url }}' },
              { name: 'admin', url: '${{ needs.deploy-admin.outputs.deployment-url }}' },
              { name: 'landing', url: '${{ needs.deploy-landing.outputs.deployment-url }}' },
            ];

            const results = [];
            for (const app of apps) {
              if (!app.url) {
                results.push(`❌ ${app.name}: No deployment URL`);
                continue;
              }
              try {
                const response = await fetch(app.url, {
                  method: 'GET',
                  redirect: 'follow',
                  signal: AbortSignal.timeout(30000),
                });
                if (response.ok) {
                  results.push(`✅ ${app.name}: ${response.status} (${app.url})`);
                } else {
                  results.push(`❌ ${app.name}: ${response.status} (${app.url})`);
                }
              } catch (error) {
                results.push(`❌ ${app.name}: ${error.message}`);
              }
            }

            const summary = results.join('\n');
            console.log(summary);

            core.summary.addHeading('Production Health Checks', 3);
            core.summary.addCodeBlock(summary);
            await core.summary.write();

            const failed = results.filter(r => r.startsWith('❌'));
            if (failed.length > 0) {
              core.setFailed(`${failed.length} health check(s) failed`);
            }

      - name: Create production deployment tag
        run: |
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config user.name "${{ github.actor }}"

          TIMESTAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          TAG="deploy/production/${TIMESTAMP}/${OPS_SELECTED_SHA}"
          git tag -a "${TAG}" "${OPS_SELECTED_SHA}" \
            -m "Production deployment at ${TIMESTAMP}" \
            -m "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin "${TAG}"

          echo "### Production Deployment Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA:** ${OPS_SELECTED_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** ${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Timestamp:** ${TIMESTAMP}" >> "$GITHUB_STEP_SUMMARY"

  ops-record:
    name: Record Ops Outcomes
    if: always()
    needs: [build-web, build-admin, build-landing, deploy-web, deploy-admin, deploy-landing, deploy-convex, validate, post-deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github
      - name: Persist app outcomes
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          OPS_NEEDS: ${{ toJSON(needs) }}
          OPS_ENVIRONMENT: production
          OPS_SHA: ${{ inputs.git_sha }}
          OPS_OPERATION: deploy
          OPS_REQUEST_ID: ${{ inputs.request_id }}
          OPS_HEALTH_JOB: post-deploy
        with:
          script: |
            const record = require('./.github/scripts/record-ops.cjs');
            await record({ github, context, core });
