name: CI Verify Commit
run-name: ${{ inputs.worker_check && format('Worker check {0}', inputs.worker_proof) || 'CI Verify Commit' }}

# Runs every CI workflow, with E2E required, against the exact tip of main.
# Pull-request CI tests the PR head; a squash merge creates a new commit that
# no PR run has tested. Tags are created only on a commit with a green run here,
# matched by the run's head SHA.

on:
  workflow_dispatch:
    inputs:
      worker_check:
        description: Test disposable local workers on this branch (does not verify a release)
        type: boolean
        default: false
      worker_pool:
        description: Explicit local diagnostic pool; leave empty for release verification
        type: string
        default: ""
      worker_sha:
        description: Local proof sha
        type: string
        default: ""
      worker_image:
        description: Local proof image
        type: string
        default: ""
      worker_runtime:
        description: Local proof runtime
        type: string
        default: ""
      worker_proof:
        description: Local proof identity
        type: string
        default: ""
      worker_checked:
        description: Local proof timestamp
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-verify-${{ github.sha }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve commit
    if: ${{ !inputs.worker_check }}
    runs-on: ${{ fromJSON(vars.PLATFORM_CI_WORKER_POOL != '' && format('["self-hosted","{0}","starter-source-{1}","starter-run-{2}"]', vars.PLATFORM_CI_WORKER_POOL, github.sha, github.run_id) || format('["{0}"]', vars.PLATFORM_CI_AUX_RUNNER || vars.PLATFORM_CI_RUNNER || (vars.PLATFORM_CI_LOCAL_ONLY == 'true' && 'starter-local-only-unconfigured' || 'ubuntu-latest'))) }}
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Require main
        id: resolve
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Run this workflow on main"; exit 1; }
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  shared:
    needs: resolve
    uses: ./.github/workflows/platform-ci-shared.yml
    with:
      git_sha: ${{ needs.resolve.outputs.sha }}

  web:
    needs: resolve
    uses: ./.github/workflows/platform-ci-web.yml
    with:
      git_sha: ${{ needs.resolve.outputs.sha }}
      require_e2e: true

  admin:
    needs: resolve
    uses: ./.github/workflows/platform-ci-admin.yml
    with:
      git_sha: ${{ needs.resolve.outputs.sha }}
      require_e2e: true

  landing:
    needs: resolve
    uses: ./.github/workflows/platform-ci-landing.yml
    with:
      git_sha: ${{ needs.resolve.outputs.sha }}
      require_e2e: true

  storybook:
    needs: resolve
    uses: ./.github/workflows/platform-ci-storybook.yml
    with:
      git_sha: ${{ needs.resolve.outputs.sha }}
      require_e2e: true

  verified:
    name: Verified
    needs: [resolve, shared, web, admin, landing, storybook]
    runs-on: ${{ fromJSON(vars.PLATFORM_CI_WORKER_POOL != '' && format('["self-hosted","{0}","starter-source-{1}","starter-run-{2}"]', vars.PLATFORM_CI_WORKER_POOL, github.sha, github.run_id) || format('["{0}"]', vars.PLATFORM_CI_AUX_RUNNER || vars.PLATFORM_CI_RUNNER || (vars.PLATFORM_CI_LOCAL_ONLY == 'true' && 'starter-local-only-unconfigured' || 'ubuntu-latest'))) }}
    steps:
      - name: Report the verified commit
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: echo "All CI, including E2E, passed on $SHA"

  worker-first:
    name: Worker isolation 1
    if: inputs.worker_check && inputs.worker_pool != ''
    runs-on: ${{ fromJSON(format('["self-hosted","{0}","starter-source-{1}","starter-run-{2}"]', inputs.worker_pool, github.sha, github.run_id)) }}
    timeout-minutes: 15
    steps:
      - name: Verify prepared environment and poison private state
        env:
          EXPECTED_PROOF: ${{ inputs.worker_proof }}
          EXPECTED_POOL: ${{ inputs.worker_pool }}
          EXPECTED_CHECKED: ${{ inputs.worker_checked }}
          EXPECTED_SHA: ${{ inputs.worker_sha }}
          EXPECTED_IMAGE: ${{ inputs.worker_image }}
          EXPECTED_RUNTIME: ${{ inputs.worker_runtime }}
        run: |
          node /opt/starter/verify-proof.mjs
          node /opt/starter/smoke.mjs
          touch /home/worker/.first-github-job

  worker-second:
    name: Worker isolation 2
    needs: worker-first
    runs-on: ${{ fromJSON(format('["self-hosted","{0}","starter-source-{1}","starter-run-{2}"]', inputs.worker_pool, github.sha, github.run_id)) }}
    timeout-minutes: 15
    steps:
      - name: Check image and runtime identity; first job data must be gone
        env:
          EXPECTED_PROOF: ${{ inputs.worker_proof }}
          EXPECTED_POOL: ${{ inputs.worker_pool }}
          EXPECTED_CHECKED: ${{ inputs.worker_checked }}
          EXPECTED_SHA: ${{ inputs.worker_sha }}
          EXPECTED_IMAGE: ${{ inputs.worker_image }}
          EXPECTED_RUNTIME: ${{ inputs.worker_runtime }}
        run: |
          test ! -e /home/worker/.first-github-job
          node /opt/starter/verify-proof.mjs
          node /opt/starter/smoke.mjs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - name: Verify frozen offline install against this exact commit
        run: bun install --offline --frozen-lockfile
