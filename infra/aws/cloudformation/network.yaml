AWSTemplateFormatVersion: '2010-09-09'
Description: Network stack (VPC, ALB, host-based routing for web/admin, security groups, target groups, public URLs).

Parameters:
  ProjectName:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9-]*$'
  Environment:
    Type: String
    AllowedValues: [local, staging, production]
  VpcCidr:
    Type: String
    Default: 10.60.0.0/16
  PublicSubnet1Cidr:
    Type: String
    Default: 10.60.0.0/24
  PublicSubnet2Cidr:
    Type: String
    Default: 10.60.1.0/24
  PrivateSubnet1Cidr:
    Type: String
    Default: 10.60.10.0/24
  PrivateSubnet2Cidr:
    Type: String
    Default: 10.60.11.0/24
  WebHost:
    Type: String
  AdminHost:
    Type: String
  EnableHttps:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Terminate TLS on the ALB. Passkeys and secure auth cookies need HTTPS, so only `local` should turn this off.
  AcmCertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate covering every host above (a wildcard for the parent domain is simplest).
  HttpListenerPort:
    Type: Number
    Default: 80
    Description: Plain-HTTP listener port. Local (Floci) uses 8080 so no privileged port has to be published.
  HostedZoneId:
    Type: String
    Default: ''
    Description: Route53 hosted zone to create alias records in. Leave empty to manage DNS yourself.
  AppContainerPort:
    Type: Number
    Default: 3000

Conditions:
  UseHttps: !Equals [!Ref EnableHttps, 'true']
  DefaultHttpPort: !Equals [!Ref HttpListenerPort, 80]
  ManageDns: !Not [!Equals [!Ref HostedZoneId, '']]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-vpc'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-igw'

  VpcIgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet1Cidr
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-public-a'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet2Cidr
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-public-b'

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-private-a'

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-private-b'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcIgwAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  NatEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-nat'

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet1

  PrivateSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet2

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow inbound HTTP/HTTPS to the ALB
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref HttpListenerPort
          ToPort: !Ref HttpListenerPort
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  AlbHttpsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: UseHttps
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow traffic from the ALB to the web and admin containers
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref AppContainerPort
          ToPort: !Ref AppContainerPort
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-alb'
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref AlbSecurityGroup]
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      LoadBalancerAttributes:
        # web/admin derive their own origin from the Host header (getRequestOrigin),
        # so the ALB must pass it through untouched.
        - Key: routing.http.preserve_host_header.enabled
          Value: 'true'
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-web'
      Port: !Ref AppContainerPort
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref Vpc
      HealthCheckPath: /
      Matcher:
        HttpCode: '200-399'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  AdminTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-admin'
      Port: !Ref AppContainerPort
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref Vpc
      HealthCheckPath: /
      Matcher:
        HttpCode: '200-399'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  # HTTP actions (Better Auth routes, waitlist endpoints) are served on the
  # site proxy port, not the API port, so they need their own host and target group.
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: !Ref HttpListenerPort
      Protocol: HTTP
      DefaultActions:
        - !If
          - UseHttps
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: '443'
              StatusCode: HTTP_301
          - Type: fixed-response
            FixedResponseConfig:
              StatusCode: '404'
              ContentType: text/plain
              MessageBody: Not Found

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: UseHttps
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref AcmCertificateArn
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '404'
            ContentType: text/plain
            MessageBody: Not Found

  # Host rules live on whichever listener serves traffic: HTTPS when enabled
  # (plain HTTP only redirects), otherwise plain HTTP.
  WebRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !If [UseHttps, !Ref HttpsListener, !Ref HttpListener]
      Priority: 10
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values: [!Ref WebHost]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

  AdminRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !If [UseHttps, !Ref HttpsListener, !Ref HttpListener]
      Priority: 20
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values: [!Ref AdminHost]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AdminTargetGroup

  WebDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: ManageDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref WebHost
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApplicationLoadBalancer.DNSName
        HostedZoneId: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID

  AdminDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: ManageDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref AdminHost
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApplicationLoadBalancer.DNSName
        HostedZoneId: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export:
      Name: !Sub '${ProjectName}-${Environment}-VpcId'

  PrivateSubnetIds:
    Value: !Join [',', [!Ref PrivateSubnet1, !Ref PrivateSubnet2]]
    Export:
      Name: !Sub '${ProjectName}-${Environment}-PrivateSubnetIds'

  AlbDnsName:
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub '${ProjectName}-${Environment}-AlbDnsName'

  ServiceSecurityGroupId:
    Value: !Ref ServiceSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ServiceSecurityGroupId'

  WebTargetGroupArn:
    Value: !Ref WebTargetGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-WebTargetGroupArn'

  AdminTargetGroupArn:
    Value: !Ref AdminTargetGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-AdminTargetGroupArn'

  # Public URLs. Every other stack and script reads these rather than repeating
  # host names, so a host is configured in exactly one place.
  WebUrl:
    Value: !If
      - UseHttps
      - !Sub 'https://${WebHost}'
      - !If [DefaultHttpPort, !Sub 'http://${WebHost}', !Sub 'http://${WebHost}:${HttpListenerPort}']
    Export:
      Name: !Sub '${ProjectName}-${Environment}-WebUrl'

  AdminUrl:
    Value: !If
      - UseHttps
      - !Sub 'https://${AdminHost}'
      - !If [DefaultHttpPort, !Sub 'http://${AdminHost}', !Sub 'http://${AdminHost}:${HttpListenerPort}']
    Export:
      Name: !Sub '${ProjectName}-${Environment}-AdminUrl'

