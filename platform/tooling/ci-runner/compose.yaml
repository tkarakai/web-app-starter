# Self-hosted CI runners for the starter. Copy this file and the Dockerfile into a
# folder outside the repository, add a .env file, then:
#
#   docker compose build
#   docker compose up -d --scale runner=2
#
# platform/docs/private-repo-ci.md walks through it.
services:
  runner:
    build:
      context: .
      args:
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:?set PLAYWRIGHT_VERSION in .env}
    image: starter-ci-runner
    restart: always
    environment:
      REPO_URL: ${REPO_URL:?set REPO_URL in .env}
      RUNNER_SCOPE: repo
      ACCESS_TOKEN: ${GITHUB_RUNNER_PAT:?set GITHUB_RUNNER_PAT in .env}
      LABELS: ${RUNNER_LABELS:-starter-ci}
      RUNNER_NAME_PREFIX: ${RUNNER_NAME_PREFIX:-starter-ci}
      EPHEMERAL: "true"        # a fresh registration for every job
    # Shared by every runner on this machine. A new version lands next to the old
    # ones and is downloaded once, instead of every job restoring GitHub's cache.
    volumes:
      - toolcache:/opt/hostedtoolcache        # Node, used by setup-node
      - bun:/root/.bun                        # Bun and its package cache
      - playwright:/root/.cache/ms-playwright # Chromium, one folder per version
      - convex:/root/.cache/convex            # Convex local backend binaries

volumes:
  toolcache:
  bun:
  playwright:
  convex:
